name: Mapa de dependencias

on:
  workflow_dispatch:
  push:
    branches: [developmen]
    paths-ignore:
      - 'mapa/**'

permissions:
  contents: write

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Ejecutar el escáner
        run: node herramientas/escaner-mapa.js

      - name: Guardar los reportes
        run: |
          git config user.name "escaner-schoolnet"
          git config user.email "escaner@colegiotilata.edu.co"
          git add mapa/
          if git diff --staged --quiet; then
            echo "Sin cambios en el mapa."
          else
            git commit -m "Mapa de dependencias actualizado"
            git push
          fi
