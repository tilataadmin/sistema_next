<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Familias - Colegio Tilatá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #1b365d;
            --brand-secondary: #efefef;
            --brand-tertiary: #3d6199;
        }
        body {
            background-color: var(--brand-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        /* El ancho cambia según la pantalla: el acceso es un formulario angosto,
           la oferta de actividades necesita espacio para las tarjetas. */
        .portal-wrapper {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 1rem;
            transition: max-width 0.2s ease;
        }
        .portal-wrapper.ancho { max-width: 720px; }

        body.con-dashboard { align-items: flex-start; padding-top: 2rem; padding-bottom: 2rem; }

        .portal-header { text-align: center; margin-bottom: 1.5rem; }
        .portal-header .brand-logo { max-height: 72px; width: auto; }

        .portal-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .btn-brand {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #fff;
        }
        .btn-brand:hover,
        .btn-brand:focus {
            background-color: var(--brand-tertiary);
            border-color: var(--brand-tertiary);
            color: #fff;
        }
        .btn-brand:disabled {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #fff;
            opacity: 0.65;
        }
        .btn-enviar .spinner-border { width: 1rem; height: 1rem; }

        .chip {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 0.35rem;
            background-color: #eef1f6;
            color: var(--brand-primary);
            margin: 0.1rem 0.15rem 0.1rem 0;
            white-space: nowrap;
        }
        .chip-alerta { background-color: #fde2e1; color: #8c2f2d; }
        .chip-ok     { background-color: #d6ecdd; color: #14683f; }

        .tarjeta-actividad {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #fff;
        }
        .tarjeta-actividad.bloqueada { opacity: 0.6; background: #fafafa; }

        .tarjeta-inscrita {
            border-left: 4px solid var(--brand-primary);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.75rem;
            background: #fff;
            border-top: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
        }

        /* Cada opción de transporte es una fila completa con su precio: la
           familia compara los tres valores antes de decidir, no después. */
        .opcion-transporte {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        /* El hover solo insinúa; la selección se ve por el fondo. Antes ambos
           cambiaban el borde y una opción bajo el cursor parecía elegida. */
        .opcion-transporte:hover { border-color: #b9c4d4; }
        .opcion-transporte.elegida {
            border-color: var(--brand-primary);
            background-color: #f4f7fb;
        }
        .opcion-transporte input { margin-right: 0.5rem; }
        .opcion-valor { font-weight: 600; color: var(--brand-primary); white-space: nowrap; }

        .nav-hijos .nav-link { color: var(--brand-tertiary); }
        .nav-hijos .nav-link.active {
            background-color: var(--brand-primary);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="portal-wrapper" id="portal-wrapper">

        <!-- Encabezado / marca -->
        <div class="portal-header">
            <img src="https://mrtuerkncqodhakuwjob.supabase.co/storage/v1/object/public/certificates/branding/Logo-Tilata.png"
                 alt="Colegio Tilatá" class="brand-logo">
            <p class="text-muted mt-2 mb-0">Portal de Familias</p>
        </div>

        <div class="card portal-card">
            <div class="card-body p-4">

                <!-- Contenedor de mensajes -->
                <div id="mensaje"></div>

                <!-- Pantalla 1: Solicitud de código -->
                <div id="pantalla-correo">
                    <p class="mb-3">
                        Ingresa el correo electrónico registrado en el colegio.
                        Te enviaremos un código para validar tu acceso.
                    </p>

                    <div class="mb-3">
                        <label for="input-correo" class="form-label">Correo electrónico</label>
                        <input
                            type="email"
                            class="form-control"
                            id="input-correo"
                            placeholder="tucorreo@ejemplo.com"
                            autocomplete="email"
                            inputmode="email">
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-brand btn-enviar" id="btn-enviar" onclick="solicitarCodigo()">
                            <i class="bi bi-envelope me-1"></i>Enviar código
                        </button>
                    </div>
                </div>

                <!-- Pantalla 2: Verificación de código -->
                <div id="pantalla-codigo" style="display: none;">
                    <p class="mb-3">
                        Ingresa el código de 6 dígitos que enviamos a tu correo.
                    </p>

                    <div class="mb-3">
                        <label for="input-codigo" class="form-label">Código</label>
                        <input
                            type="text"
                            class="form-control form-control-lg text-center"
                            id="input-codigo"
                            placeholder="000000"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            style="letter-spacing: 8px;">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-brand" id="btn-validar" onclick="validarCodigo()">
                            <i class="bi bi-check-circle me-1"></i>Validar
                        </button>
                        <button type="button" class="btn btn-link btn-sm text-muted" onclick="volverACorreo()">
                            Usar otro correo
                        </button>
                    </div>
                </div>

                <!-- Pantalla 3: Extracurriculares -->
                <div id="pantalla-dashboard" style="display: none;">
                    <div id="dashboard-cargando" class="text-center text-muted py-3">
                        <span class="spinner-border spinner-border-sm me-2"></span>Cargando...
                    </div>

                    <div id="dashboard-contenido" style="display: none;">
                        <div id="bloque-inscritas"></div>
                        <div id="bloque-oferta"></div>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="button" class="btn btn-link btn-sm text-muted" onclick="salir()">
                            Salir
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <p class="text-center text-muted small mt-3 mb-0">
            ¿Problemas para ingresar? Comunícate con el colegio.
        </p>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        // El portal es un solo archivo servido en dos dominios, y cada dominio
        // debe hablar con su propio GAS: uno escribe en desarrollo y el otro en
        // producción. Se decide por el nombre del host, igual que config.js.
        // El caso por defecto es DESARROLLO a propósito: un dominio no previsto
        // debe escribir en la base que no importa, nunca en la que sí.
        const GAS_ENDPOINTS = {
            development: 'https://script.google.com/macros/s/AKfycbykOwF7EWwbpaVqZTk-hWwqj7crzEZZNMTOFVpq5XDXw-Wwm25wACoF3pyq5ZVw6bQ/exec',
            production:  'https://script.google.com/macros/s/AKfycbyUwhyHw_eVXNIczXzstljUyw1s5PhcVaLflyYA5-igq4cBxBXJ6LGN9mt7u0V7n84/exec'
        };

        const PORTAL_AMBIENTE =
            window.location.hostname === 'schoolnet.colegiotilata.edu.co' ? 'production' : 'development';

        const GAS_ENDPOINT = GAS_ENDPOINTS[PORTAL_AMBIENTE];

        console.log('Portal de Familias — ambiente: ' + PORTAL_AMBIENTE.toUpperCase());

        // Aviso visible fuera de producción.
        if (PORTAL_AMBIENTE !== 'production') {
            document.addEventListener('DOMContentLoaded', function () {
                const cinta = document.createElement('div');
                cinta.textContent = 'DESARROLLO';
                cinta.style.cssText =
                    'position:fixed;top:0;left:0;right:0;background:#8a6d1f;color:#fff;' +
                    'font:600 12px/1.6 Arial,sans-serif;text-align:center;letter-spacing:2px;z-index:9999;';
                document.body.appendChild(cinta);
            });
        }

        // Estado de sesión (solo en memoria, no se persiste)
        let correoActual = '';
        let sessionToken = '';
        let sessionExpiresAt = '';

        // Estado de la oferta
        let oferta = null;            // respuesta de get_extracurricular_offer
        let inscripciones = [];       // respuesta de get_my_enrollments
        let hijoActivo = null;        // student_id de la pestaña visible
        let transporteElegido = {};   // activity_id -> 'none' | 'linked' | 'unlinked'

        const DIAS = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 7: 'Domingo' };

        const TRANSPORTE = {
            none:     { etiqueta: 'Sin transporte',            detalle: 'La familia lo recoge al terminar.' },
            linked:   { etiqueta: 'Solicito servicio de ruta y ya tengo ruta con el operador oficial del colegio', detalle: '' },
            unlinked: { etiqueta: 'Solicito servicio de ruta y no tengo ruta con el operador oficial del colegio', detalle: '' }
        };

        const fmtPesos = v => '$ ' + Number(v || 0).toLocaleString('es-CO');
        const fmtFecha = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-CO',
            { day: '2-digit', month: 'long', year: 'numeric' }) : '';

        // ==========================================
        // UTILIDADES
        // ==========================================
        function mostrarMensaje(texto, tipo = 'info') {
            const cont = document.getElementById('mensaje');
            const iconos = { success: 'check-circle', danger: 'exclamation-triangle', warning: 'exclamation-triangle', info: 'info-circle' };
            cont.innerHTML = `
                <div class="alert alert-${tipo} d-flex align-items-center" role="alert">
                    <i class="bi bi-${iconos[tipo] || 'info-circle'} me-2"></i>
                    <div>${texto}</div>
                </div>`;
            cont.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function limpiarMensaje() {
            document.getElementById('mensaje').innerHTML = '';
        }

        function correoValido(correo) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
        }

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto == null ? '' : String(texto);
            return div.innerHTML;
        }

        function setCargando(cargando) {
            const btn = document.getElementById('btn-enviar');
            if (cargando) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border me-1" role="status"></span>Enviando...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-envelope me-1"></i>Enviar código';
            }
        }

        async function llamarGas(payload) {
            const resp = await fetch(GAS_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await resp.json();
        }

        // ==========================================
        // SOLICITAR CÓDIGO
        // ==========================================
        async function solicitarCodigo() {
            limpiarMensaje();
            const correo = document.getElementById('input-correo').value.trim().toLowerCase();

            if (!correoValido(correo)) {
                mostrarMensaje('Ingresa un correo electrónico válido.', 'warning');
                return;
            }

            setCargando(true);

            try {
                // Se envía como text/plain para evitar el preflight CORS de Apps Script.
                // request_code no necesita leer la respuesta (el mensaje es neutro siempre),
                // así que va en modo no-cors.
                await fetch(GAS_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'request_code', email: correo })
                });

                // Respuesta neutra: nunca revela si el correo existe o no.
                mostrarMensaje('Si el correo está registrado, recibirás un código en unos minutos.', 'success');
                correoActual = correo;
                mostrarPantallaCodigo();

            } catch (error) {
                console.error('Error solicitando código:', error);
                mostrarMensaje('No fue posible procesar la solicitud. Intenta de nuevo en un momento.', 'danger');
            } finally {
                setCargando(false);
            }
        }

        // ==========================================
        // NAVEGACIÓN ENTRE PANTALLAS
        // ==========================================
        function mostrarPantallaCodigo() {
            document.getElementById('pantalla-correo').style.display = 'none';
            document.getElementById('pantalla-codigo').style.display = 'block';
            document.getElementById('input-codigo').value = '';
            document.getElementById('input-codigo').focus();
        }

        function volverACorreo() {
            limpiarMensaje();
            document.getElementById('pantalla-codigo').style.display = 'none';
            document.getElementById('pantalla-correo').style.display = 'block';
        }

        function salir() {
            // El token vive solo en memoria; salir es olvidarlo.
            sessionToken = '';
            sessionExpiresAt = '';
            oferta = null;
            inscripciones = [];
            hijoActivo = null;
            transporteElegido = {};

            document.body.classList.remove('con-dashboard');
            document.getElementById('portal-wrapper').classList.remove('ancho');
            document.getElementById('pantalla-dashboard').style.display = 'none';
            document.getElementById('dashboard-contenido').style.display = 'none';
            limpiarMensaje();
            document.getElementById('pantalla-correo').style.display = 'block';
        }

        // ==========================================
        // VALIDAR CÓDIGO
        // ==========================================
        async function validarCodigo() {
            limpiarMensaje();
            const codigo = document.getElementById('input-codigo').value.trim();

            if (!/^\d{6}$/.test(codigo)) {
                mostrarMensaje('El código debe tener 6 dígitos.', 'warning');
                return;
            }

            const btn = document.getElementById('btn-validar');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border me-1" role="status" style="width:1rem;height:1rem;"></span>Validando...';

            try {
                const data = await llamarGas({ action: 'verify_code', email: correoActual, code: codigo });

                if (data.ok) {
                    sessionToken = data.token;
                    sessionExpiresAt = data.expires_at;
                    document.getElementById('pantalla-codigo').style.display = 'none';
                    limpiarMensaje();
                    await cargarDashboard();
                } else {
                    mostrarMensaje(data.message || 'No fue posible validar el código.', 'danger');
                }
            } catch (error) {
                console.error('Error validando código:', error);
                mostrarMensaje('No fue posible validar el código. Intenta de nuevo.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Validar';
            }
        }

        // ==========================================
        // DASHBOARD
        // ==========================================
        async function cargarDashboard() {
            document.body.classList.add('con-dashboard');
            document.getElementById('portal-wrapper').classList.add('ancho');
            document.getElementById('pantalla-dashboard').style.display = 'block';
            document.getElementById('dashboard-cargando').style.display = 'block';
            document.getElementById('dashboard-contenido').style.display = 'none';

            try {
                // Las dos lecturas van en paralelo: son independientes y así la
                // espera es la del endpoint más lento, no la suma.
                const [ofertaResp, inscResp] = await Promise.all([
                    llamarGas({ action: 'get_extracurricular_offer', token: sessionToken }),
                    llamarGas({ action: 'get_my_enrollments', token: sessionToken })
                ]);

                if (!ofertaResp.ok && ofertaResp.error === 'session') {
                    mostrarMensaje('Tu sesión venció. Vuelve a ingresar.', 'warning');
                    salir();
                    return;
                }

                oferta = ofertaResp;
                inscripciones = (inscResp && inscResp.ok) ? (inscResp.enrollments || []) : [];

                if (hijoActivo === null && oferta.children && oferta.children.length > 0) {
                    hijoActivo = oferta.children[0].student_id;
                }

                document.getElementById('dashboard-cargando').style.display = 'none';
                document.getElementById('dashboard-contenido').style.display = 'block';
                render();

            } catch (error) {
                console.error('Error cargando el dashboard:', error);
                document.getElementById('dashboard-cargando').style.display = 'none';
                mostrarMensaje('No fue posible cargar la información. Intenta de nuevo.', 'danger');
            }
        }

        function render() {
            renderInscritas();
            renderOferta();
        }

        // --- Inscripciones vigentes ---
        function renderInscritas() {
            const cont = document.getElementById('bloque-inscritas');

            if (inscripciones.length === 0) { cont.innerHTML = ''; return; }

            const filas = inscripciones.map(function (i) {
                const dias = (i.days || []).map(d => `<span class="chip">${DIAS[d]}</span>`).join('');
                const transporte = TRANSPORTE[i.transport_option]
                    ? TRANSPORTE[i.transport_option].etiqueta : i.transport_option;

                return `<div class="tarjeta-inscrita">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <div class="fw-semibold">${escaparHtml(i.activity_name)}</div>
                            <div class="text-muted small">${escaparHtml(i.student_name)}</div>
                        </div>
                        <div class="text-end">
                            <div class="opcion-valor">${fmtPesos(i.total_value)}</div>
                            <div class="text-muted small">${i.sessions} sesiones</div>
                        </div>
                    </div>
                    <div class="mt-2">
                        ${dias}
                        <span class="chip chip-ok"><i class="bi bi-bus-front me-1"></i>${escaparHtml(transporte)}</span>
                    </div>
                </div>`;
            }).join('');

            cont.innerHTML = `
                <h5 class="mb-3"><i class="bi bi-check2-circle me-2"></i>Inscripciones confirmadas</h5>
                ${filas}
                <p class="text-muted small">
                    Para cambiar o cancelar una inscripción, comunícate con el colegio.
                </p>
                <hr class="my-4">`;
        }

        // --- Oferta disponible ---
        function renderOferta() {
            const cont = document.getElementById('bloque-oferta');

            // Sin temporada abierta: cada caso trae su propio mensaje desde el servidor.
            if (!oferta.season) {
                cont.innerHTML = `<div class="text-center text-muted py-3">
                    <i class="bi bi-calendar-x d-block mb-2" style="font-size:2rem;"></i>
                    ${escaparHtml(oferta.message || 'No hay actividades disponibles por ahora.')}
                </div>`;
                return;
            }

            const hijos = oferta.children || [];
            if (hijos.length === 0) {
                cont.innerHTML = '<div class="text-center text-muted py-3">No encontramos estudiantes asociados a este correo.</div>';
                return;
            }

            // Pestañas solo si hay más de un hijo: con uno solo, una pestaña
            // única es ruido.
            let pestanas = '';
            if (hijos.length > 1) {
                pestanas = `<ul class="nav nav-pills nav-hijos mb-3">` +
                    hijos.map(h => `<li class="nav-item">
                        <button class="nav-link ${h.student_id === hijoActivo ? 'active' : ''}"
                                onclick="cambiarHijo(${h.student_id})">${escaparHtml(h.name.split(' ')[0])}</button>
                    </li>`).join('') + `</ul>`;
            }

            const hijo = hijos.find(h => h.student_id === hijoActivo) || hijos[0];

            const encabezado = `
                <h5 class="mb-1"><i class="bi bi-stars me-2"></i>${escaparHtml(oferta.season.cycle_name)}</h5>
                <p class="text-muted small mb-3">
                    Del ${fmtFecha(oferta.season.start_date)} al ${fmtFecha(oferta.season.end_date)}.
                    Las inscripciones cierran el ${fmtFecha(oferta.season.enrollment_end_date)}.
                </p>`;

            const subtitulo = hijos.length > 1
                ? `<p class="mb-3"><strong>${escaparHtml(hijo.name)}</strong> · ${escaparHtml(hijo.course || '')}</p>`
                : `<p class="mb-3 text-muted">Actividades disponibles para <strong>${escaparHtml(hijo.name)}</strong> (${escaparHtml(hijo.course || '')}).</p>`;

            const acts = hijo.activities || [];
            const cuerpo = acts.length === 0
                ? `<div class="text-muted fst-italic">No hay actividades disponibles para su grado en esta temporada.</div>`
                : acts.map(a => renderActividad(hijo, a)).join('');

            cont.innerHTML = encabezado + pestanas + subtitulo + cuerpo;
        }

        function renderActividad(hijo, a) {
            const dias = (a.days || []).map(d => `<span class="chip">${DIAS[d]}</span>`).join('');

            // Dos razones distintas para no poder inscribir, con mensajes distintos.
            let bloqueo = null;
            if (a.lleno) {
                bloqueo = 'Esta actividad ya completó su cupo.';
            } else if (a.conflict) {
                bloqueo = `${escaparHtml(hijo.name.split(' ')[0])} ya tiene <strong>${escaparHtml(a.conflict.activity)}</strong>
                           los ${DIAS[a.conflict.day].toLowerCase()}. No puede estar en dos actividades el mismo día.`;
            }

            const elegido = transporteElegido[a.activity_id] || null;

            const opciones = bloqueo ? '' : Object.keys(TRANSPORTE).map(function (k) {
                const t = TRANSPORTE[k];
                return `<label class="opcion-transporte ${elegido === k ? 'elegida' : ''}">
                    <span class="d-flex align-items-start">
                        <input type="radio" name="tr-${a.activity_id}" value="${k}"
                               ${elegido === k ? 'checked' : ''}
                               onchange="elegirTransporte('${a.activity_id}', '${k}')">
                        <span>
                            <span class="fw-semibold d-block">${t.etiqueta}</span>
                            ${t.detalle ? `<span class="text-muted small">${t.detalle}</span>` : ''}
                        </span>
                    </span>
                    <span class="opcion-valor">${fmtPesos(a.options[k])}</span>
                </label>`;
            }).join('');

            const aviso = bloqueo
                ? `<div class="alert alert-secondary py-2 px-3 mb-0 small mt-2">
                       <i class="bi bi-info-circle me-1"></i>${bloqueo}</div>`
                : `<p class="text-muted small mt-2 mb-2">
                       El colegio verifica con el operador de transporte lo que declares aquí.
                       Si no corresponde, se ajusta el valor a cobrar.<br>
                       El colegio enviará la factura por el medio acostumbrado. Cualquier inquietud
                       al respecto, por favor contacte a Tesorería.</p>
                   <div class="d-grid">
                       <button class="btn btn-brand" ${elegido ? '' : 'disabled'}
                               onclick="inscribir(${hijo.student_id}, '${a.activity_id}')">
                           <i class="bi bi-person-plus me-1"></i>${elegido ? 'Inscribir' : 'Elige una opción de transporte'}
                       </button>
                   </div>`;

            return `<div class="tarjeta-actividad ${bloqueo ? 'bloqueada' : ''}">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <div class="fw-semibold" style="font-size:1.05rem;">${escaparHtml(a.activity_name)}</div>
                        ${a.description ? `<div class="text-muted small">${escaparHtml(a.description)}</div>` : ''}
                    </div>
                    <div class="text-end">
                        <div class="text-muted small">${a.sessions} sesiones</div>
                        ${a.lleno ? '<span class="chip chip-alerta">Cupo lleno</span>'
                                  : `<span class="chip">${a.cupos_libres} cupos</span>`}
                    </div>
                </div>
                <div class="mt-2 mb-3">${dias}</div>
                ${opciones}
                ${aviso}
            </div>`;
        }

        function cambiarHijo(studentId) {
            hijoActivo = studentId;
            limpiarMensaje();
            render();
        }

        function elegirTransporte(activityId, opcion) {
            transporteElegido[activityId] = opcion;
            render();
        }

        // ==========================================
        // INSCRIBIR
        // ==========================================
        async function inscribir(studentId, activityId) {
            const opcion = transporteElegido[activityId];
            if (!opcion) return;

            const hijo = (oferta.children || []).find(h => h.student_id === studentId);
            const act = hijo ? (hijo.activities || []).find(a => a.activity_id === activityId) : null;
            if (!hijo || !act) return;

            const total = act.options[opcion];
            const confirmar = `¿Inscribir a ${hijo.name} en ${act.activity_name}?\n\n` +
                `${TRANSPORTE[opcion].etiqueta}\n` +
                `Valor de la temporada: ${fmtPesos(total)}\n\n` +
                `Una vez inscrito, los cambios se hacen con el colegio.`;

            if (!confirm(confirmar)) return;

            limpiarMensaje();
            mostrarMensaje('<span class="spinner-border spinner-border-sm me-2"></span>Registrando la inscripción...', 'info');

            try {
                const data = await llamarGas({
                    action: 'enroll_student',
                    token: sessionToken,
                    student_id: studentId,
                    activity_id: activityId,
                    transport_option: opcion
                });

                if (!data.ok) {
                    if (data.error === 'session') {
                        mostrarMensaje('Tu sesión venció. Vuelve a ingresar.', 'warning');
                        salir();
                        return;
                    }
                    // Los mensajes de la base llegan ya redactados para el usuario.
                    mostrarMensaje(escaparHtml(data.message || 'No fue posible completar la inscripción.'), 'danger');
                    return;
                }

                let texto = `Listo. ${escaparHtml(hijo.name)} quedó inscrito en ` +
                            `<strong>${escaparHtml(data.activity_name)}</strong> por ${fmtPesos(data.total_value)}.` +
                            `<br><span class="small">Te enviamos la confirmación a ${escaparHtml(correoActual)}.</span>`;
                (data.warnings || []).forEach(function (w) { texto += `<br><span class="small">${escaparHtml(w)}</span>`; });

                delete transporteElegido[activityId];

                // Se recarga desde el servidor y no se modifica el estado local:
                // la inscripción cambia los cupos, los días ocupados y la lista de
                // actividades disponibles de TODOS los hijos, no solo de este.
                await cargarDashboard();
                mostrarMensaje(texto, 'success');

            } catch (error) {
                console.error('Error inscribiendo:', error);
                mostrarMensaje('No fue posible completar la inscripción. Intenta de nuevo.', 'danger');
            }
        }

        // Permitir enviar con Enter
        document.getElementById('input-correo').addEventListener('keyup', function (e) {
            if (e.key === 'Enter') solicitarCodigo();
        });

        document.getElementById('input-codigo').addEventListener('keyup', function (e) {
            if (e.key === 'Enter') validarCodigo();
        });
    </script>
</body>
</html>
