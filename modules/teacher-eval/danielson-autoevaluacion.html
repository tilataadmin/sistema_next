<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="page-version" content="26.9.25.3">
    <title>Mi Autoevaluación Danielson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-overlay.hidden { display: none; }
        .loading-content { background: white; padding: 2rem; border-radius: 8px; text-align: center; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .barra-avance { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 0; margin-bottom: 1rem; }

        .domain-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1rem; overflow: hidden; }
        .domain-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; }
        .domain-header:hover { background: #f8f9fa; }
        .domain-order { background: #0ea5e9; color: white; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .domain-info { flex: 1; }
        .domain-name { font-weight: 600; font-size: 1.05rem; color: #1e293b; margin: 0; }
        .domain-progress { font-size: 0.78rem; color: #64748b; }
        .chevron { transition: transform 0.3s; color: #94a3b8; }
        .domain-header.collapsed .chevron { transform: rotate(-90deg); }
        .domain-body { padding: 0 1.25rem 1.25rem; }

        .component-item { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 0.9rem; overflow: hidden; }
        .component-item.sin-marcar { border-color: #fca5a5; }
        .component-header { padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem; background: #f8fafc; }
        .component-code { background: #e0f2fe; color: #0284c7; font-weight: 700; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 6px; flex-shrink: 0; }
        .component-name { flex: 1; font-size: 0.92rem; color: #334155; font-weight: 500; }
        .component-flag { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; }
        .flag-ok { background: #dcfce7; color: #15803d; }
        .flag-falta { background: #fee2e2; color: #b91c1c; }

        .levels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; }
        .level-col { padding: 0.85rem; border-right: 1px solid #e2e8f0; }
        .level-col:last-child { border-right: none; }
        .level-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.6rem; padding: 0.15rem 0.5rem; border-radius: 4px; display: inline-block; }
        .lv-1 { background: #fee2e2; color: #b91c1c; }
        .lv-2 { background: #fef3c7; color: #b45309; }
        .lv-3 { background: #d1fae5; color: #047857; }
        .lv-4 { background: #dbeafe; color: #1d4ed8; }

        .vineta-check { display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.45rem; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
        .vineta-check .form-check-input { flex: 0 0 auto; width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; }
        .vineta-check .form-check-input:checked { background-color: #0ea5e9; border-color: #0ea5e9; }
        .vineta-check:hover { background: #f1f5f9; }
        .vineta-check.marcada { background: #f0f9ff; }
        .vineta-check.bloqueada { cursor: default; }
        .vineta-check.bloqueada:hover { background: transparent; }
        .vineta-texto { font-size: 0.82rem; color: #475569; line-height: 1.45; }

        @media (max-width: 991px) {
            .levels-grid { grid-template-columns: 1fr; }
            .level-col { border-right: none; border-bottom: 1px solid #e2e8f0; }
            .level-col:last-child { border-bottom: none; }
        }
    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="mb-0">Cargando...</p>
        </div>
    </div>

    <div class="container-fluid">
        <nav aria-label="breadcrumb" class="mt-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="../../dashboard.html"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="breadcrumb-item"><a href="index.html">Evaluación de Desempeño</a></li>
                <li class="breadcrumb-item active" aria-current="page">Mi Autoevaluación Danielson</li>
            </ol>
        </nav>

        <div class="mb-3">
            <h1 class="h3 mb-1">
                <i class="bi bi-person-check me-2" style="color: #0ea5e9;"></i>Mi Autoevaluación
            </h1>
            <p class="text-muted mb-0">Marque las viñetas que describen su práctica actual en cada componente</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Mensaje cuando no hay evaluación disponible -->
        <div id="sin-evaluacion" class="alert alert-secondary d-none"></div>

        <!-- Contenido principal -->
        <div id="contenido" class="d-none">
            <div class="barra-avance">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <span id="estado-badge" class="badge"></span>
                        <span class="ms-2 small text-muted" id="texto-avance"></span>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="progress" style="width: 220px; height: 10px;">
                            <div class="progress-bar" id="barra-progreso" style="width: 0%; background: #0ea5e9;"></div>
                        </div>
                        <button class="btn btn-primary" id="btn-enviar" onclick="enviarAutoevaluacion()">
                            <i class="bi bi-send me-1"></i>Enviar autoevaluación
                        </button>
                    </div>
                </div>
                <div id="aviso-modo" class="small mt-2"></div>
            </div>

            <div id="dominios-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script>
        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        const VERSION_MARCA = 'autoevaluacion';
        const LEVEL_CLASSES = ['lv-1', 'lv-2', 'lv-3', 'lv-4'];

        let currentUser = null;
        let miWorker = null;
        let cicloActivo = null;
        let evaluacion = null;
        let levels = [];
        let domains = [];
        let components = [];
        let descriptors = [];
        let items = [];
        let marcas = [];
        let expandedDomains = {};
        let editable = false;

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const session = getStoredSession();
                if (!session || !session.user) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = session.user;

                const hasAccess = await validatePageAccess('Mi Autoevaluación Danielson');
                if (!hasAccess) return;

                await iniciar();
            } catch (error) {
                console.error('Error inicializando:', error);
                showMessage('Error al cargar la página: ' + error.message, 'danger');
            }
        });

        async function iniciar() {
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const usuarios = await supabaseRequest(`/users?select=user_mail&user_id=eq.${currentUser.user_id}&limit=1`);
                if (!usuarios.length) { mostrarSinEvaluacion('No se encontró su usuario en el sistema.'); return; }

                const correo = usuarios[0].user_mail;
                const workers = await supabaseRequest(`/workers?select=worker_id,worker_first_name,worker_last_name_1,worker_last_name_2&email=eq.${encodeURIComponent(correo)}&limit=1`);
                if (!workers.length) {
                    mostrarSinEvaluacion('Su usuario no está vinculado a una ficha de trabajador, por lo que no es posible cargar su autoevaluación. Escriba a Desarrollo Profesional.');
                    return;
                }
                miWorker = workers[0];

                const ciclos = await supabaseRequest('/teval_dn_cycles?select=*,academic_years(year_name)&cycle_status=eq.open&limit=1');
                if (!ciclos.length) {
                    mostrarSinEvaluacion('En este momento no hay un ciclo de evaluación abierto.');
                    return;
                }
                cicloActivo = ciclos[0];

                const evals = await supabaseRequest(`/teval_dn_evaluations?select=*&cycle_id=eq.${cicloActivo.cycle_id}&worker_id=eq.${miWorker.worker_id}&limit=1`);
                if (!evals.length) {
                    mostrarSinEvaluacion('Usted no está incluido en el ciclo de evaluación abierto. Si cree que es un error, escriba a Desarrollo Profesional.');
                    return;
                }
                evaluacion = evals[0];

                await cargarRubrica();
                await cargarMarcas();
                calcularModo();
                render();
                document.getElementById('contenido').classList.remove('d-none');
            } catch (error) {
                console.error('Error cargando autoevaluación:', error);
                showMessage('Error al cargar: ' + error.message, 'danger');
            }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function mostrarSinEvaluacion(texto) {
            const div = document.getElementById('sin-evaluacion');
            div.textContent = texto;
            div.classList.remove('d-none');
        }

        // ==========================================
        // CARGA DE DATOS
        // ==========================================
        async function cargarRubrica() {
            const [lv, dm, cp, ds, it] = await Promise.all([
                supabaseRequest('/teval_rubric_levels?select=*&level_status=eq.active&order=level_order.asc'),
                supabaseRequest('/teval_rubric_domains?select=*&domain_status=eq.active&order=domain_order.asc'),
                supabaseRequest('/teval_rubric_components?select=*&component_status=eq.active&order=component_order.asc'),
                supabaseRequest('/teval_rubric_descriptors?select=*'),
                supabaseRequest('/teval_rubric_descriptor_items?select=*&order=item_order.asc')
            ]);
            levels = lv; domains = dm; components = cp; descriptors = ds; items = it;
        }

        async function cargarMarcas() {
            marcas = await supabaseRequest(`/teval_dn_marks?select=mark_id,item_id&evaluation_id=eq.${evaluacion.evaluation_id}&mark_version=eq.${VERSION_MARCA}`);
        }

        function calcularModo() {
            const estadoEditable = evaluacion.eval_status === 'pendiente' || evaluacion.eval_status === 'autoevaluacion_enviada';
            editable = estadoEditable && cicloActivo.cycle_status === 'open';
        }

        // ==========================================
        // RENDER
        // ==========================================
        function render() {
            renderBarra();
            renderDominios();
        }

        function itemsDe(componentId, levelId) {
            const d = descriptors.find(x => x.component_id === componentId && x.level_id === levelId);
            if (!d) return [];
            return items
                .filter(i => i.descriptor_id === d.descriptor_id && (i.item_status === 'active' || estaMarcado(i.item_id)))
                .sort((a, b) => a.item_order - b.item_order);
        }

        function estaMarcado(itemId) {
            return marcas.some(m => m.item_id === itemId);
        }

        function componenteCompleto(componentId) {
            return levels.some(l => itemsDe(componentId, l.level_id).some(i => estaMarcado(i.item_id)));
        }

        function renderBarra() {
            const completos = components.filter(c => componenteCompleto(c.component_id)).length;
            const total = components.length;
            const pct = total ? Math.round(completos * 100 / total) : 0;

            document.getElementById('texto-avance').textContent = `${completos} de ${total} componentes con al menos una viñeta marcada`;
            document.getElementById('barra-progreso').style.width = pct + '%';

            const badge = document.getElementById('estado-badge');
            const etiquetas = {
                'pendiente': ['Sin enviar', 'bg-secondary'],
                'autoevaluacion_enviada': ['Enviada', 'bg-success'],
                'en_revision': ['En revisión', 'bg-info'],
                'revisada': ['Revisada', 'bg-primary']
            };
            const et = etiquetas[evaluacion.eval_status] || [evaluacion.eval_status, 'bg-secondary'];
            badge.textContent = et[0];
            badge.className = 'badge ' + et[1];

            const btn = document.getElementById('btn-enviar');
            const aviso = document.getElementById('aviso-modo');

            if (!editable) {
                btn.classList.add('d-none');
                aviso.className = 'small mt-2 text-muted';
                aviso.textContent = evaluacion.eval_status === 'pendiente'
                    ? 'La autoevaluación no está habilitada en este momento.'
                    : 'Su autoevaluación ya pasó a revisión, por lo que no se puede modificar. Los resultados se conversarán en la reunión con su directivo.';
                return;
            }

            btn.classList.remove('d-none');
            btn.disabled = completos < total;
            btn.innerHTML = evaluacion.eval_status === 'autoevaluacion_enviada'
                ? '<i class="bi bi-arrow-repeat me-1"></i>Actualizar envío'
                : '<i class="bi bi-send me-1"></i>Enviar autoevaluación';

            aviso.className = 'small mt-2 text-muted';
            if (completos < total) {
                aviso.textContent = 'Cada cambio se guarda automáticamente. Podrá enviar cuando todos los componentes tengan al menos una viñeta marcada.';
            } else if (evaluacion.eval_status === 'autoevaluacion_enviada') {
                aviso.textContent = 'Su autoevaluación está enviada. Puede seguir ajustándola hasta que su directivo inicie la revisión; use "Actualizar envío" después de cambiar algo.';
            } else {
                aviso.textContent = 'Ya puede enviar su autoevaluación.';
            }
        }

        function renderDominios() {
            const cont = document.getElementById('dominios-container');
            cont.innerHTML = domains.map(dom => {
                const comps = components.filter(c => c.domain_id === dom.domain_id);
                const completos = comps.filter(c => componenteCompleto(c.component_id)).length;
                const abierto = expandedDomains[dom.domain_id] !== false;

                return `
                    <div class="card domain-card">
                        <div class="domain-header ${abierto ? '' : 'collapsed'}" onclick="toggleDomain('${dom.domain_id}')">
                            <div class="domain-order">${dom.domain_order}</div>
                            <div class="domain-info">
                                <p class="domain-name">${escapeHtml(dom.domain_name)}</p>
                                <div class="domain-progress">${completos} de ${comps.length} componentes marcados</div>
                            </div>
                            <i class="bi bi-chevron-down chevron"></i>
                        </div>
                        <div class="domain-body" id="domain-body-${dom.domain_id}" style="${abierto ? '' : 'display:none;'}">
                            ${comps.map(c => renderComponente(c)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderComponente(comp) {
            const completo = componenteCompleto(comp.component_id);
            return `
                <div class="component-item ${completo ? '' : 'sin-marcar'}">
                    <div class="component-header">
                        <span class="component-code">${escapeHtml(comp.component_code)}</span>
                        <span class="component-name">${escapeHtml(comp.component_name)}</span>
                        <span class="component-flag ${completo ? 'flag-ok' : 'flag-falta'}">${completo ? 'Marcado' : 'Falta'}</span>
                    </div>
                    <div class="levels-grid">
                        ${levels.map((l, idx) => {
                            const lista = itemsDe(comp.component_id, l.level_id);
                            return `
                                <div class="level-col">
                                    <div class="level-title ${LEVEL_CLASSES[idx % LEVEL_CLASSES.length]}">${escapeHtml(l.level_name)}</div>
                                    ${lista.length ? lista.map(i => {
                                        const marcado = estaMarcado(i.item_id);
                                        return `
                                            <label class="vineta-check ${marcado ? 'marcada' : ''} ${editable ? '' : 'bloqueada'}">
                                                <input type="checkbox" class="form-check-input mt-1" ${marcado ? 'checked' : ''} ${editable ? '' : 'disabled'} onchange="alternarMarca('${i.item_id}', this)">
                                                <span class="vineta-texto">${escapeHtml(i.item_text)}</span>
                                            </label>
                                        `;
                                    }).join('') : '<div class="text-muted small fst-italic">Sin viñetas</div>'}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleDomain(domainId) {
            const body = document.getElementById('domain-body-' + domainId);
            const header = body.previousElementSibling;
            const visible = body.style.display !== 'none';
            body.style.display = visible ? 'none' : '';
            header.classList.toggle('collapsed', visible);
            expandedDomains[domainId] = !visible;
        }

        // ==========================================
        // MARCAR / DESMARCAR
        // ==========================================
        async function alternarMarca(itemId, checkbox) {
            if (!editable) return;
            const marcada = marcas.find(m => m.item_id === itemId);

            try {
                if (checkbox.checked && !marcada) {
                    const creada = await supabaseRequest('/teval_dn_marks', {
                        method: 'POST',
                        body: JSON.stringify({
                            evaluation_id: evaluacion.evaluation_id,
                            item_id: itemId,
                            mark_version: VERSION_MARCA,
                            created_by: currentUser.user_id
                        })
                    });
                    const fila = Array.isArray(creada) ? creada[0] : creada;
                    marcas.push({ mark_id: fila.mark_id, item_id: itemId });
                } else if (!checkbox.checked && marcada) {
                    await supabaseRequest(`/teval_dn_marks?mark_id=eq.${marcada.mark_id}`, { method: 'DELETE' });
                    marcas = marcas.filter(m => m.item_id !== itemId);
                }

                if (evaluacion.eval_status === 'autoevaluacion_enviada') {
                    await supabaseRequest('/rpc/teval_dn_calc_results', {
                        method: 'POST',
                        body: JSON.stringify({ p_evaluation_id: evaluacion.evaluation_id, p_version: VERSION_MARCA })
                    });
                }

                render();
            } catch (error) {
                console.error('Error guardando la marca:', error);
                showMessage('No se pudo guardar el cambio: ' + error.message, 'danger');
                await cargarMarcas();
                render();
            }
        }

        // ==========================================
        // ENVÍO
        // ==========================================
        async function enviarAutoevaluacion() {
            const faltan = components.filter(c => !componenteCompleto(c.component_id));
            if (faltan.length) {
                showMessage(`Faltan ${faltan.length} componente(s) por marcar`, 'warning');
                return;
            }

            const primerEnvio = evaluacion.eval_status !== 'autoevaluacion_enviada';
            const texto = primerEnvio
                ? '¿Enviar su autoevaluación?\n\nPodrá seguir ajustándola hasta que su directivo inicie la revisión conjunta.'
                : '¿Actualizar el envío con los cambios que hizo?';
            if (!confirm(texto)) return;

            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                await supabaseRequest('/rpc/teval_dn_calc_results', {
                    method: 'POST',
                    body: JSON.stringify({ p_evaluation_id: evaluacion.evaluation_id, p_version: VERSION_MARCA })
                });

                await supabaseRequest(`/teval_dn_evaluations?evaluation_id=eq.${evaluacion.evaluation_id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        eval_status: 'autoevaluacion_enviada',
                        submitted_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });

                evaluacion.eval_status = 'autoevaluacion_enviada';
                calcularModo();
                render();
                showMessage(primerEnvio ? 'Autoevaluación enviada' : 'Envío actualizado', 'success');
            } catch (error) {
                console.error('Error enviando autoevaluación:', error);
                showMessage('Error al enviar: ' + error.message, 'danger');
            }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        // ==========================================
        // UTILIDADES
        // ==========================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.toggleDomain = toggleDomain;
        window.alternarMarca = alternarMarca;
        window.enviarAutoevaluacion = enviarAutoevaluacion;

        console.log('🎉 Autoevaluación Danielson cargada');
    </script>
</body>
</html>
