<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="page-version" content="26.9.26.2">
    <title>Mi Autoevaluación Danielson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-overlay.hidden { display: none; }
        .loading-content { background: white; padding: 2rem; border-radius: 8px; text-align: center; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .barra-avance { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 0; margin-bottom: 1rem; }

        .domain-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1rem; overflow: hidden; }
        .domain-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; }
        .domain-header:hover { background: #f8f9fa; }
        .domain-order { background: #0ea5e9; color: white; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .domain-info { flex: 1; }
        .domain-name { font-weight: 600; font-size: 1.05rem; color: #1e293b; margin: 0; }
        .domain-progress { font-size: 0.78rem; color: #64748b; }
        .chevron { transition: transform 0.3s; color: #94a3b8; }
        .domain-header.collapsed .chevron { transform: rotate(-90deg); }
        .domain-body { padding: 0 1.25rem 1.25rem; }

        .component-item { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 0.9rem; overflow: hidden; }
        .component-item.sin-marcar { border-color: #fca5a5; }
        .component-header { padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem; background: #f8fafc; }
        .component-code { background: #e0f2fe; color: #0284c7; font-weight: 700; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 6px; flex-shrink: 0; }
        .component-name { flex: 1; font-size: 0.92rem; color: #334155; font-weight: 500; }
        .component-flag { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; }
        .flag-ok { background: #dcfce7; color: #15803d; }
        .flag-falta { background: #fee2e2; color: #b91c1c; }

        .levels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; }
        .level-col { padding: 0.85rem; border-right: 1px solid #e2e8f0; }
        .level-col:last-child { border-right: none; }
        .level-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.6rem; padding: 0.15rem 0.5rem; border-radius: 4px; display: inline-block; }
        .lv-1 { background: #fee2e2; color: #b91c1c; }
        .lv-2 { background: #fef3c7; color: #b45309; }
        .lv-3 { background: #d1fae5; color: #047857; }
        .lv-4 { background: #dbeafe; color: #1d4ed8; }

        .vineta-check { display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.45rem; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
        .vineta-check .form-check-input { flex: 0 0 auto; width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; }
        .vineta-check .form-check-input:checked { background-color: #0ea5e9; border-color: #0ea5e9; }
        .vineta-check:hover { background: #f1f5f9; }
        .vineta-check.marcada { background: #f0f9ff; }
        .vineta-check.bloqueada { cursor: default; }
        .vineta-check.bloqueada:hover { background: transparent; }
        .vineta-texto { font-size: 0.82rem; color: #475569; line-height: 1.45; }
        .perfil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.4rem; }
        .perfil-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.5rem; border-radius: 6px; background: #f8fafc; }
        .perfil-code { background: #e0f2fe; color: #0284c7; font-weight: 700; font-size: 0.72rem; padding: 0.1rem 0.4rem; border-radius: 4px; }
        .perfil-nombre { flex: 1; font-size: 0.78rem; color: #475569; }
        .perfil-valor { font-weight: 700; font-size: 0.82rem; }
        .n1 { color: #b91c1c; } .n2 { color: #b45309; } .n3 { color: #047857; } .n4 { color: #1d4ed8; }
        .meta-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem; margin-bottom: 0.9rem; }
        .meta-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
        .meta-num { background: #0ea5e9; color: #fff; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; }
        .valoracion-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.7rem; background: #f8fafc; margin-top: 0.7rem; }
        .pill { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px; }
        .pill-gris { background: #f1f5f9; color: #64748b; }
        .pill-verde { background: #dcfce7; color: #15803d; }
        .pill-ambar { background: #fef3c7; color: #b45309; }
        .sin-dato { color: #94a3b8; font-style: italic; font-size: 0.85rem; }
        .rs-axis { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
        .rs-axis-head { background: #f8fafc; padding: 0.7rem 1rem; font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .rs-comp { padding: 0.8rem 1rem; border-top: 1px solid #f1f5f9; }
        .rs-comp-name { font-size: 0.86rem; font-weight: 600; color: #334155; margin-bottom: 0.7rem; }
        .rs-crit { padding: 0.6rem 0; border-bottom: 1px dashed #f1f5f9; }
        .rs-crit:last-child { border-bottom: none; }
        .rs-crit.sin-responder { background: #fff7ed; border-radius: 6px; padding-left: 0.5rem; padding-right: 0.5rem; }
        .rs-crit-text { font-size: 0.83rem; color: #475569; line-height: 1.45; margin-bottom: 0.5rem; }
        .rs-opts { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .rs-opt { font-size: 0.78rem; padding: 0.3rem 0.7rem; border: 1px solid #cbd5e1; border-radius: 999px; cursor: pointer; background: #fff; color: #475569; }
        .rs-opt:hover { background: #f1f5f9; }
        .rs-opt.activa { background: #0ea5e9; border-color: #0ea5e9; color: #fff; font-weight: 600; }
        .rs-opt.na { border-style: dashed; }
        .rs-opt.na.activa { background: #94a3b8; border-color: #94a3b8; }
        .rs-opt:disabled { cursor: default; opacity: 0.75; }
        @media (max-width: 991px) {
            .levels-grid { grid-template-columns: 1fr; }
            .level-col { border-right: none; border-bottom: 1px solid #e2e8f0; }
            .level-col:last-child { border-bottom: none; }
        }
    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="mb-0">Cargando...</p>
        </div>
    </div>

    <div class="container-fluid">
        <nav aria-label="breadcrumb" class="mt-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="../../dashboard.html"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="breadcrumb-item"><a href="index.html">Evaluación de Desempeño</a></li>
                <li class="breadcrumb-item active" aria-current="page">Mi Autoevaluación Danielson</li>
            </ol>
        </nav>

        <div class="mb-3">
            <h1 class="h3 mb-1">
                <i class="bi bi-person-check me-2" style="color: #0ea5e9;"></i>Mi Autoevaluación
            </h1>
            <p class="text-muted mb-0">Marque las viñetas que describen su práctica actual en cada componente</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Mensaje cuando no hay evaluación disponible -->
        <div id="sin-evaluacion" class="alert alert-secondary d-none"></div>

        <!-- Contenido principal -->
        <div id="contenido" class="d-none">
            <div class="barra-avance">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <span id="estado-badge" class="badge"></span>
                        <span class="ms-2 small text-muted" id="texto-avance"></span>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="progress" style="width: 220px; height: 10px;">
                            <div class="progress-bar" id="barra-progreso" style="width: 0%; background: #0ea5e9;"></div>
                        </div>
                        <button class="btn btn-primary" id="btn-enviar" onclick="enviarAutoevaluacion()">
                            <i class="bi bi-send me-1"></i>Enviar autoevaluación
                        </button>
                    </div>
                </div>
                <div id="aviso-modo" class="small mt-2"></div>
            </div>

            <div id="seccion-responsabilidades" class="card mb-3 d-none">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h6 class="mb-0"><i class="bi bi-card-checklist me-2"></i>Responsabilidades</h6>
                    <div class="d-flex align-items-center gap-2">
                        <span id="rs-estado" class="badge"></span>
                        <span class="small text-muted" id="rs-avance"></span>
                        <button class="btn btn-primary btn-sm" id="btn-enviar-rs" onclick="enviarResponsabilidades()">
                            <i class="bi bi-send me-1"></i>Enviar
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="rs-aviso" class="small text-muted mb-3"></div>
                    <div id="rs-ejes"></div>
                </div>
            </div>

            <div id="seccion-resultado" class="card mb-3 d-none">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-bar-chart me-2"></i>Mi resultado (versión revisada)</h6>
                    <span class="small text-muted" id="resultado-global"></span>
                </div>
                <div class="card-body">
                    <div class="perfil-grid" id="resultado-componentes"></div>
                </div>
            </div>

            <div id="seccion-plan" class="card mb-3 d-none">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h6 class="mb-0"><i class="bi bi-flag me-2"></i>Mi plan de mejora</h6>
                    <button class="btn btn-sm btn-primary d-none" id="btn-acuse" onclick="darAcuse()">
                        <i class="bi bi-check2-square me-1"></i>Confirmo que conozco mi plan
                    </button>
                </div>
                <div class="card-body">
                    <div id="plan-aviso" class="small text-muted mb-3"></div>
                    <div id="plan-metas"></div>
                    <div id="plan-sugerencias"></div>
                </div>
            </div>

            <div id="dominios-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script>
        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        const VERSION_MARCA = 'autoevaluacion';
        const LEVEL_CLASSES = ['lv-1', 'lv-2', 'lv-3', 'lv-4'];

        let currentUser = null;
        let miWorker = null;
        let cicloActivo = null;
        let evaluacion = null;
        let levels = [];
        let domains = [];
        let components = [];
        let descriptors = [];
        let items = [];
        let marcas = [];
        let expandedDomains = {};
        let editable = false;
        let config = null;
        let resultados = [];
        let miPlan = null;
        let misMetas = [];
        let rsEval = null;
        let rsAxes = [];
        let rsComponents = [];
        let rsCriteria = [];
        let rsOptions = {};
        let rsAnswers = [];
        let rsEditable = false;

        const ESTADOS_META = [
            { v: 'cumplida', t: 'Cumplida' },
            { v: 'parcialmente_cumplida', t: 'Parcialmente cumplida' },
            { v: 'no_cumplida', t: 'No cumplida' }
        ];

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const session = getStoredSession();
                if (!session || !session.user) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = session.user;

                const hasAccess = await validatePageAccess('Mi Autoevaluación Danielson');
                if (!hasAccess) return;

                await iniciar();
            } catch (error) {
                console.error('Error inicializando:', error);
                showMessage('Error al cargar la página: ' + error.message, 'danger');
            }
        });

        async function iniciar() {
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const usuarios = await supabaseRequest(`/users?select=user_mail&user_id=eq.${currentUser.user_id}&limit=1`);
                if (!usuarios.length) { mostrarSinEvaluacion('No se encontró su usuario en el sistema.'); return; }

                const correo = usuarios[0].user_mail;
                const workers = await supabaseRequest(`/workers?select=worker_id,worker_first_name,worker_last_name_1,worker_last_name_2&email=eq.${encodeURIComponent(correo)}&limit=1`);
                if (!workers.length) {
                    mostrarSinEvaluacion('Su usuario no está vinculado a una ficha de trabajador, por lo que no es posible cargar su autoevaluación. Escriba a Desarrollo Profesional.');
                    return;
                }
                miWorker = workers[0];

                const ciclos = await supabaseRequest('/teval_dn_cycles?select=*,academic_years(year_name)&cycle_status=eq.open&limit=1');
                if (!ciclos.length) {
                    mostrarSinEvaluacion('En este momento no hay un ciclo de evaluación abierto.');
                    return;
                }
                cicloActivo = ciclos[0];

                const evals = await supabaseRequest(`/teval_dn_evaluations?select=*&cycle_id=eq.${cicloActivo.cycle_id}&worker_id=eq.${miWorker.worker_id}&limit=1`);
                if (!evals.length) {
                    mostrarSinEvaluacion('Usted no está incluido en el ciclo de evaluación abierto. Si cree que es un error, escriba a Desarrollo Profesional.');
                    return;
                }
                evaluacion = evals[0];

                await cargarRubrica();
                await cargarMarcas();
                await cargarResultadosYPlan();
                await cargarResponsabilidades();
                calcularModo();
                render();
                document.getElementById('contenido').classList.remove('d-none');
            } catch (error) {
                console.error('Error cargando autoevaluación:', error);
                showMessage('Error al cargar: ' + error.message, 'danger');
            }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function mostrarSinEvaluacion(texto) {
            const div = document.getElementById('sin-evaluacion');
            div.textContent = texto;
            div.classList.remove('d-none');
        }

        // ==========================================
        // CARGA DE DATOS
        // ==========================================
        async function cargarRubrica() {
            const [lv, dm, cp, ds, it] = await Promise.all([
                supabaseRequest('/teval_rubric_levels?select=*&level_status=eq.active&order=level_order.asc'),
                supabaseRequest('/teval_rubric_domains?select=*&domain_status=eq.active&order=domain_order.asc'),
                supabaseRequest('/teval_rubric_components?select=*&component_status=eq.active&order=component_order.asc'),
                supabaseRequest('/teval_rubric_descriptors?select=*'),
                supabaseRequest('/teval_rubric_descriptor_items?select=*&order=item_order.asc')
            ]);
            levels = lv; domains = dm; components = cp; descriptors = ds; items = it;
        }

        async function cargarMarcas() {
            marcas = await supabaseRequest(`/teval_dn_marks?select=mark_id,item_id&evaluation_id=eq.${evaluacion.evaluation_id}&mark_version=eq.${VERSION_MARCA}`);
        }

        function calcularModo() {
            const estadoEditable = evaluacion.eval_status === 'pendiente' || evaluacion.eval_status === 'autoevaluacion_enviada';
            editable = estadoEditable && cicloActivo.cycle_status === 'open';
        }

        // ==========================================
        // RENDER
        // ==========================================
       function render() {
            renderBarra();
            renderResponsabilidades();
            renderResultado();
            renderPlan();
            renderDominios();
        }

        function itemsDe(componentId, levelId) {
            const d = descriptors.find(x => x.component_id === componentId && x.level_id === levelId);
            if (!d) return [];
            return items
                .filter(i => i.descriptor_id === d.descriptor_id && (i.item_status === 'active' || estaMarcado(i.item_id)))
                .sort((a, b) => a.item_order - b.item_order);
        }

        function estaMarcado(itemId) {
            return marcas.some(m => m.item_id === itemId);
        }

        function componenteCompleto(componentId) {
            return levels.some(l => itemsDe(componentId, l.level_id).some(i => estaMarcado(i.item_id)));
        }

        function renderBarra() {
            const completos = components.filter(c => componenteCompleto(c.component_id)).length;
            const total = components.length;
            const pct = total ? Math.round(completos * 100 / total) : 0;

            document.getElementById('texto-avance').textContent = `${completos} de ${total} componentes con al menos una viñeta marcada`;
            document.getElementById('barra-progreso').style.width = pct + '%';

            const badge = document.getElementById('estado-badge');
            const etiquetas = {
                'pendiente': ['Sin enviar', 'bg-secondary'],
                'autoevaluacion_enviada': ['Enviada', 'bg-success'],
                'en_revision': ['En revisión', 'bg-info'],
                'revisada': ['Revisada', 'bg-primary']
            };
            const et = etiquetas[evaluacion.eval_status] || [evaluacion.eval_status, 'bg-secondary'];
            badge.textContent = et[0];
            badge.className = 'badge ' + et[1];

            const btn = document.getElementById('btn-enviar');
            const aviso = document.getElementById('aviso-modo');

            if (!editable) {
                btn.classList.add('d-none');
                aviso.className = 'small mt-2 text-muted';
                aviso.textContent = evaluacion.eval_status === 'pendiente'
                    ? 'La autoevaluación no está habilitada en este momento.'
                    : 'Su autoevaluación ya pasó a revisión, por lo que no se puede modificar. Los resultados se conversarán en la reunión con su directivo.';
                return;
            }

            btn.classList.remove('d-none');
            btn.disabled = completos < total;
            btn.innerHTML = evaluacion.eval_status === 'autoevaluacion_enviada'
                ? '<i class="bi bi-arrow-repeat me-1"></i>Actualizar envío'
                : '<i class="bi bi-send me-1"></i>Enviar autoevaluación';

            aviso.className = 'small mt-2 text-muted';
            if (completos < total) {
                aviso.textContent = 'Cada cambio se guarda automáticamente. Podrá enviar cuando todos los componentes tengan al menos una viñeta marcada.';
            } else if (evaluacion.eval_status === 'autoevaluacion_enviada') {
                aviso.textContent = 'Su autoevaluación está enviada. Puede seguir ajustándola hasta que su directivo inicie la revisión; use "Actualizar envío" después de cambiar algo.';
            } else {
                aviso.textContent = 'Ya puede enviar su autoevaluación.';
            }
        }

        function renderDominios() {
            const cont = document.getElementById('dominios-container');
            cont.innerHTML = domains.map(dom => {
                const comps = components.filter(c => c.domain_id === dom.domain_id);
                const completos = comps.filter(c => componenteCompleto(c.component_id)).length;
                const abierto = expandedDomains[dom.domain_id] !== false;

                return `
                    <div class="card domain-card">
                        <div class="domain-header ${abierto ? '' : 'collapsed'}" onclick="toggleDomain('${dom.domain_id}')">
                            <div class="domain-order">${dom.domain_order}</div>
                            <div class="domain-info">
                                <p class="domain-name">${escapeHtml(dom.domain_name)}</p>
                                <div class="domain-progress">${completos} de ${comps.length} componentes marcados</div>
                            </div>
                            <i class="bi bi-chevron-down chevron"></i>
                        </div>
                        <div class="domain-body" id="domain-body-${dom.domain_id}" style="${abierto ? '' : 'display:none;'}">
                            ${comps.map(c => renderComponente(c)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderComponente(comp) {
            const completo = componenteCompleto(comp.component_id);
            return `
                <div class="component-item ${completo ? '' : 'sin-marcar'}">
                    <div class="component-header">
                        <span class="component-code">${escapeHtml(comp.component_code)}</span>
                        <span class="component-name">${escapeHtml(comp.component_name)}</span>
                        <span class="component-flag ${completo ? 'flag-ok' : 'flag-falta'}">${completo ? 'Marcado' : 'Falta'}</span>
                    </div>
                    <div class="levels-grid">
                        ${levels.map((l, idx) => {
                            const lista = itemsDe(comp.component_id, l.level_id);
                            return `
                                <div class="level-col">
                                    <div class="level-title ${LEVEL_CLASSES[idx % LEVEL_CLASSES.length]}">${escapeHtml(l.level_name)}</div>
                                    ${lista.length ? lista.map(i => {
                                        const marcado = estaMarcado(i.item_id);
                                        return `
                                            <label class="vineta-check ${marcado ? 'marcada' : ''} ${editable ? '' : 'bloqueada'}">
                                                <input type="checkbox" class="form-check-input mt-1" ${marcado ? 'checked' : ''} ${editable ? '' : 'disabled'} onchange="alternarMarca('${i.item_id}', this)">
                                                <span class="vineta-texto">${escapeHtml(i.item_text)}</span>
                                            </label>
                                        `;
                                    }).join('') : '<div class="text-muted small fst-italic">Sin viñetas</div>'}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleDomain(domainId) {
            const body = document.getElementById('domain-body-' + domainId);
            const header = body.previousElementSibling;
            const visible = body.style.display !== 'none';
            body.style.display = visible ? 'none' : '';
            header.classList.toggle('collapsed', visible);
            expandedDomains[domainId] = !visible;
        }

        // ==========================================
        // MARCAR / DESMARCAR
        // ==========================================
        async function alternarMarca(itemId, checkbox) {
            if (!editable) return;
            const marcada = marcas.find(m => m.item_id === itemId);

            try {
                if (checkbox.checked && !marcada) {
                    const creada = await supabaseRequest('/teval_dn_marks', {
                        method: 'POST',
                        body: JSON.stringify({
                            evaluation_id: evaluacion.evaluation_id,
                            item_id: itemId,
                            mark_version: VERSION_MARCA,
                            created_by: currentUser.user_id
                        })
                    });
                    const fila = Array.isArray(creada) ? creada[0] : creada;
                    marcas.push({ mark_id: fila.mark_id, item_id: itemId });
                } else if (!checkbox.checked && marcada) {
                    await supabaseRequest(`/teval_dn_marks?mark_id=eq.${marcada.mark_id}`, { method: 'DELETE' });
                    marcas = marcas.filter(m => m.item_id !== itemId);
                }

                if (evaluacion.eval_status === 'autoevaluacion_enviada') {
                    await supabaseRequest('/rpc/teval_dn_calc_results', {
                        method: 'POST',
                        body: JSON.stringify({ p_evaluation_id: evaluacion.evaluation_id, p_version: VERSION_MARCA })
                    });
                }

                render();
            } catch (error) {
                console.error('Error guardando la marca:', error);
                showMessage('No se pudo guardar el cambio: ' + error.message, 'danger');
                await cargarMarcas();
                render();
            }
        }

        // ==========================================
        // ENVÍO
        // ==========================================
        async function enviarAutoevaluacion() {
            const faltan = components.filter(c => !componenteCompleto(c.component_id));
            if (faltan.length) {
                showMessage(`Faltan ${faltan.length} componente(s) por marcar`, 'warning');
                return;
            }

            const primerEnvio = evaluacion.eval_status !== 'autoevaluacion_enviada';
            const texto = primerEnvio
                ? '¿Enviar su autoevaluación?\n\nPodrá seguir ajustándola hasta que su directivo inicie la revisión conjunta.'
                : '¿Actualizar el envío con los cambios que hizo?';
            if (!confirm(texto)) return;

            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                await supabaseRequest('/rpc/teval_dn_calc_results', {
                    method: 'POST',
                    body: JSON.stringify({ p_evaluation_id: evaluacion.evaluation_id, p_version: VERSION_MARCA })
                });

                await supabaseRequest(`/teval_dn_evaluations?evaluation_id=eq.${evaluacion.evaluation_id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        eval_status: 'autoevaluacion_enviada',
                        submitted_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });

                evaluacion.eval_status = 'autoevaluacion_enviada';
                calcularModo();
                render();
                showMessage(primerEnvio ? 'Autoevaluación enviada' : 'Envío actualizado', 'success');
            } catch (error) {
                console.error('Error enviando autoevaluación:', error);
                showMessage('Error al enviar: ' + error.message, 'danger');
            }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        // ==========================================
        // RESULTADO Y PLAN DE MEJORA
        // ==========================================
        async function cargarResultadosYPlan() {
            const cfg = await supabaseRequest('/teval_dn_config?select=*&limit=1');
            config = cfg.length ? cfg[0] : null;

            resultados = evaluacion.eval_status === 'revisada'
                ? await supabaseRequest(`/teval_dn_results?select=component_id,result_value&evaluation_id=eq.${evaluacion.evaluation_id}&result_version=eq.revisada`)
                : [];

            const planes = await supabaseRequest(`/teval_dn_plans?select=*&academic_year_id=eq.${cicloActivo.academic_year_id}&worker_id=eq.${miWorker.worker_id}&limit=1`);
            miPlan = planes.length ? planes[0] : null;
            misMetas = miPlan
                ? await supabaseRequest(`/teval_dn_plan_goals?select=*&plan_id=eq.${miPlan.plan_id}&order=goal_order.asc`)
                : [];
        }

        async function cargarResponsabilidades() {
            const evals = await supabaseRequest(`/teval_rs_evaluations?select=*&cycle_id=eq.${cicloActivo.cycle_id}&worker_id=eq.${miWorker.worker_id}&limit=1`);
            rsEval = evals.length ? evals[0] : null;
            if (!rsEval) return;

            const [ax, co, cr] = await Promise.all([
                supabaseRequest('/teval_rs_axes?select=*&axis_status=eq.active&order=axis_order.asc'),
                supabaseRequest('/teval_rs_components?select=*&component_status=eq.active&order=component_order.asc'),
                supabaseRequest('/teval_rs_criteria?select=*&criterion_status=eq.active&order=criterion_order.asc')
            ]);
            rsAxes = ax.filter(a => a.applies_to === 'all' || rsEval.is_course_director);
            rsComponents = co;
            rsCriteria = cr;

            rsOptions = {};
            const escalas = [...new Set(rsAxes.map(a => a.scale_id))];
            for (const scaleId of escalas) {
                rsOptions[scaleId] = await supabaseRequest(`/survey_scale_options?select=option_id,option_text,option_value,option_order&scale_id=eq.${scaleId}&order=option_order.asc`);
            }

            rsAnswers = await supabaseRequest(`/teval_rs_answers?select=answer_id,criterion_id,option_id,is_na&evaluation_id=eq.${rsEval.evaluation_id}&answer_version=eq.autoevaluacion`);

            rsEditable = cicloActivo.cycle_status === 'open'
                && (rsEval.eval_status === 'pendiente' || rsEval.eval_status === 'autoevaluacion_enviada');
        }

        function rsCriteriosDe(componentId) {
            return rsCriteria.filter(c => c.component_id === componentId);
        }

        function rsCriteriosAplicables() {
            const compIds = rsComponents.filter(c => rsAxes.some(a => a.axis_id === c.axis_id)).map(c => c.component_id);
            return rsCriteria.filter(c => compIds.includes(c.component_id));
        }

        function rsRespuestaDe(criterionId) {
            return rsAnswers.find(a => a.criterion_id === criterionId) || null;
        }

        function renderResponsabilidades() {
            const seccion = document.getElementById('seccion-responsabilidades');
            if (!rsEval || !rsAxes.length) { seccion.classList.add('d-none'); return; }
            seccion.classList.remove('d-none');

            const aplicables = rsCriteriosAplicables();
            const respondidos = aplicables.filter(c => rsRespuestaDe(c.criterion_id)).length;

            document.getElementById('rs-avance').textContent = `${respondidos} de ${aplicables.length} criterios respondidos`;

            const badge = document.getElementById('rs-estado');
            const etiquetas = {
                'pendiente': ['Sin enviar', 'bg-secondary'],
                'autoevaluacion_enviada': ['Enviada', 'bg-success'],
                'en_revision': ['En revisión', 'bg-info'],
                'revisada': ['Revisada', 'bg-primary']
            };
            const et = etiquetas[rsEval.eval_status] || [rsEval.eval_status, 'bg-secondary'];
            badge.textContent = et[0];
            badge.className = 'badge ' + et[1];

            const btn = document.getElementById('btn-enviar-rs');
            const aviso = document.getElementById('rs-aviso');

            if (!rsEditable) {
                btn.classList.add('d-none');
                aviso.textContent = rsEval.eval_status === 'pendiente'
                    ? 'Esta evaluación no está habilitada en este momento.'
                    : 'Su jefe inmediato ya inició la revisión, por lo que no se puede modificar. Los resultados se conversarán en la reunión con él.';
            } else {
                btn.classList.remove('d-none');
                btn.disabled = respondidos < aplicables.length;
                btn.innerHTML = rsEval.eval_status === 'autoevaluacion_enviada'
                    ? '<i class="bi bi-arrow-repeat me-1"></i>Actualizar envío'
                    : '<i class="bi bi-send me-1"></i>Enviar';
                aviso.textContent = respondidos < aplicables.length
                    ? 'Responda con qué frecuencia realiza cada una. Cada respuesta se guarda automáticamente.'
                    : (rsEval.eval_status === 'autoevaluacion_enviada'
                        ? 'Ya está enviada. Puede ajustarla hasta que su jefe inicie la revisión; use "Actualizar envío" después de cambiar algo.'
                        : 'Ya puede enviar esta evaluación.');
            }

            document.getElementById('rs-ejes').innerHTML = rsAxes.map(axis => {
                const comps = rsComponents.filter(c => c.axis_id === axis.axis_id);
                const opciones = rsOptions[axis.scale_id] || [];
                return `
                    <div class="rs-axis">
                        <div class="rs-axis-head">
                            <i class="bi bi-list-check"></i>${escapeHtml(axis.axis_name)}
                            ${axis.applies_to === 'course_director' ? '<span class="pill pill-gris">Solo directores de curso</span>' : ''}
                        </div>
                        ${comps.map(comp => `
                            <div class="rs-comp">
                                <div class="rs-comp-name">${escapeHtml(comp.component_name)}</div>
                                ${rsCriteriosDe(comp.component_id).map(cr => {
                                    const resp = rsRespuestaDe(cr.criterion_id);
                                    return `
                                        <div class="rs-crit ${resp ? '' : 'sin-responder'}">
                                            <div class="rs-crit-text">${escapeHtml(cr.criterion_text)}</div>
                                            <div class="rs-opts">
                                                ${opciones.map(o => `
                                                    <button class="rs-opt ${resp && resp.option_id === o.option_id ? 'activa' : ''}"
                                                        ${rsEditable ? '' : 'disabled'}
                                                        onclick="responderCriterio('${cr.criterion_id}', '${o.option_id}', ${o.option_value}, false)">
                                                        ${escapeHtml(o.option_text)}
                                                    </button>
                                                `).join('')}
                                                ${cr.allows_na ? `
                                                    <button class="rs-opt na ${resp && resp.is_na ? 'activa' : ''}"
                                                        ${rsEditable ? '' : 'disabled'}
                                                        onclick="responderCriterio('${cr.criterion_id}', null, null, true)">
                                                        No aplica
                                                    </button>` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }

        function valorDe(componentId) {
            const r = resultados.find(x => x.component_id === componentId);
            return r ? parseFloat(r.result_value) : null;
        }

        function nivelDe(valor) {
            const rangos = (config && config.level_ranges) ? config.level_ranges : [];
            const r = rangos.find(x => valor >= x.min && valor <= x.max);
            return r ? r.level_order : Math.round(valor);
        }

        function renderResultado() {
            const seccion = document.getElementById('seccion-resultado');
            if (evaluacion.eval_status !== 'revisada' || !resultados.length) {
                seccion.classList.add('d-none');
                return;
            }
            seccion.classList.remove('d-none');

            const valores = components.map(c => valorDe(c.component_id)).filter(v => v !== null);
            const global = valores.length ? valores.reduce((a, b) => a + b, 0) / valores.length : null;
            document.getElementById('resultado-global').textContent = global !== null
                ? 'Global: ' + global.toFixed(2).replace('.', ',')
                : '';

            document.getElementById('resultado-componentes').innerHTML = components.map(c => {
                const v = valorDe(c.component_id);
                return `
                    <div class="perfil-item">
                        <span class="perfil-code">${escapeHtml(c.component_code)}</span>
                        <span class="perfil-nombre">${escapeHtml(c.component_name)}</span>
                        <span class="perfil-valor ${v !== null ? 'n' + nivelDe(v) : ''}">${v !== null ? v.toFixed(2).replace('.', ',') : '—'}</span>
                    </div>
                `;
            }).join('');
        }

        function puedeValorarMetas() {
            return cicloActivo.cycle_status === 'open'
                && cicloActivo.cycle_phase >= 5
                && miPlan && miPlan.acknowledged_at;
        }

        function renderPlan() {
            const seccion = document.getElementById('seccion-plan');
            if (!miPlan || !misMetas.length) { seccion.classList.add('d-none'); return; }
            seccion.classList.remove('d-none');

            const btnAcuse = document.getElementById('btn-acuse');
            btnAcuse.classList.toggle('d-none', !!miPlan.acknowledged_at);

            const aviso = document.getElementById('plan-aviso');
            if (!miPlan.acknowledged_at) {
                aviso.textContent = 'Revise su plan y confirme que lo conoce. La confirmación es una constancia de conocimiento, no una aprobación.';
            } else if (puedeValorarMetas()) {
                aviso.textContent = 'Registre cómo le fue con cada meta. Su directivo hará después su propia valoración en una reunión con usted.';
            } else {
                aviso.textContent = 'Plan confirmado el ' + new Date(miPlan.acknowledged_at).toLocaleDateString('es-CO') + '.';
            }

            document.getElementById('plan-metas').innerHTML = misMetas.map((m, idx) => {
                const comp = components.find(c => c.component_id === m.component_id);
                return `
                    <div class="meta-card">
                        <div class="meta-head">
                            <div class="meta-num">${idx + 1}</div>
                            <span class="perfil-code">${comp ? escapeHtml(comp.component_code) : '—'}</span>
                            <span class="flex-grow-1">${comp ? escapeHtml(comp.component_name) : ''}</span>
                        </div>
                        <div class="mb-2"><span class="fw-semibold small">Meta:</span> <span class="small">${escapeHtml(m.goal_description)}</span></div>
                        <div class="mb-2"><span class="fw-semibold small">Acciones:</span> <span class="small">${escapeHtml(m.goal_actions)}</span></div>
                        ${m.follow_up_date ? `<div class="small text-muted">Seguimiento previsto: ${formatearFecha(m.follow_up_date)}</div>` : ''}
                        <div class="valoracion-box">
                            <div class="fw-semibold small mb-2">Mi valoración</div>
                            ${puedeValorarMetas()
                                ? `<select class="form-select form-select-sm mb-2" id="est-prof-${m.goal_id}">
                                       <option value="">— Seleccione —</option>
                                       ${ESTADOS_META.map(e => `<option value="${e.v}" ${m.teacher_status === e.v ? 'selected' : ''}>${e.t}</option>`).join('')}
                                   </select>
                                   <textarea class="form-control form-control-sm mb-2" id="com-prof-${m.goal_id}" rows="2" placeholder="Comentario breve...">${escapeHtml(m.teacher_comment || '')}</textarea>
                                   <button class="btn btn-sm btn-primary" onclick="guardarMiValoracion('${m.goal_id}')"><i class="bi bi-check-lg me-1"></i>Guardar</button>`
                                : (m.teacher_status
                                    ? `<div><span class="pill ${m.teacher_status === 'cumplida' ? 'pill-verde' : (m.teacher_status === 'parcialmente_cumplida' ? 'pill-ambar' : 'pill-gris')}">${(ESTADOS_META.find(e => e.v === m.teacher_status) || {}).t}</span></div>
                                       ${m.teacher_comment ? `<div class="small text-muted mt-1">${escapeHtml(m.teacher_comment)}</div>` : ''}`
                                    : '<div class="sin-dato">Se habilita más adelante en el proceso</div>')}
                            ${m.reviewer_status
                                ? `<div class="mt-2 pt-2 border-top">
                                       <div class="fw-semibold small mb-1">Valoración del directivo</div>
                                       <span class="pill ${m.reviewer_status === 'cumplida' ? 'pill-verde' : (m.reviewer_status === 'parcialmente_cumplida' ? 'pill-ambar' : 'pill-gris')}">${(ESTADOS_META.find(e => e.v === m.reviewer_status) || {}).t}</span>
                                       ${m.reviewer_comment ? `<div class="small text-muted mt-1">${escapeHtml(m.reviewer_comment)}</div>` : ''}
                                   </div>`
                                : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('plan-sugerencias').innerHTML = miPlan.suggestions_text
                ? `<div class="mt-3">
                       <div class="fw-semibold small mb-1">Sugerencias de su directivo</div>
                       <div class="small text-muted" style="white-space: pre-wrap;">${escapeHtml(miPlan.suggestions_text)}</div>
                   </div>`
                : '';
        }

        async function responderCriterio(criterionId, optionId, optionValue, esNa) {
            if (!rsEditable) return;
            const existente = rsRespuestaDe(criterionId);

            const cuerpo = {
                evaluation_id: rsEval.evaluation_id,
                criterion_id: criterionId,
                answer_version: 'autoevaluacion',
                option_id: esNa ? null : optionId,
                option_value: esNa ? null : optionValue,
                is_na: esNa,
                updated_at: new Date().toISOString()
            };

            try {
                if (existente) {
                    await supabaseRequest(`/teval_rs_answers?answer_id=eq.${existente.answer_id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            option_id: cuerpo.option_id,
                            option_value: cuerpo.option_value,
                            is_na: cuerpo.is_na,
                            updated_at: cuerpo.updated_at
                        })
                    });
                    existente.option_id = cuerpo.option_id;
                    existente.is_na = cuerpo.is_na;
                } else {
                    cuerpo.created_by = currentUser.user_id;
                    const creada = await supabaseRequest('/teval_rs_answers', {
                        method: 'POST',
                        body: JSON.stringify(cuerpo)
                    });
                    const fila = Array.isArray(creada) ? creada[0] : creada;
                    rsAnswers.push({
                        answer_id: fila.answer_id,
                        criterion_id: criterionId,
                        option_id: cuerpo.option_id,
                        is_na: cuerpo.is_na
                    });
                }

                if (rsEval.eval_status === 'autoevaluacion_enviada') {
                    await supabaseRequest('/rpc/teval_rs_calc_results', {
                        method: 'POST',
                        body: JSON.stringify({ p_evaluation_id: rsEval.evaluation_id, p_version: 'autoevaluacion' })
                    });
                }

                renderResponsabilidades();
            } catch (error) {
                console.error('Error guardando la respuesta:', error);
                showMessage('No se pudo guardar la respuesta: ' + error.message, 'danger');
            }
        }

        async function enviarResponsabilidades() {
            const aplicables = rsCriteriosAplicables();
            const faltan = aplicables.filter(c => !rsRespuestaDe(c.criterion_id));
            if (faltan.length) {
                showMessage(`Faltan ${faltan.length} criterio(s) por responder`, 'warning');
                return;
            }

            const primerEnvio = rsEval.eval_status !== 'autoevaluacion_enviada';
            const texto = primerEnvio
                ? '¿Enviar su evaluación de responsabilidades?\n\nPodrá seguir ajustándola hasta que su jefe inmediato inicie la revisión.'
                : '¿Actualizar el envío con los cambios que hizo?';
            if (!confirm(texto)) return;

            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                await supabaseRequest('/rpc/teval_rs_calc_results', {
                    method: 'POST',
                    body: JSON.stringify({ p_evaluation_id: rsEval.evaluation_id, p_version: 'autoevaluacion' })
                });
                await supabaseRequest(`/teval_rs_evaluations?evaluation_id=eq.${rsEval.evaluation_id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        eval_status: 'autoevaluacion_enviada',
                        submitted_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });
                rsEval.eval_status = 'autoevaluacion_enviada';
                renderResponsabilidades();
                showMessage(primerEnvio ? 'Evaluación de responsabilidades enviada' : 'Envío actualizado', 'success');
            } catch (error) {
                console.error('Error enviando responsabilidades:', error);
                showMessage('Error al enviar: ' + error.message, 'danger');
            }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        async function darAcuse() {
            if (!confirm('¿Confirma que conoce su plan de mejora?\n\nEs una constancia de conocimiento, no una aprobación.')) return;
            try {
                await supabaseRequest(`/teval_dn_plans?plan_id=eq.${miPlan.plan_id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ acknowledged_at: new Date().toISOString(), updated_at: new Date().toISOString() })
                });
                miPlan.acknowledged_at = new Date().toISOString();
                renderPlan();
                showMessage('Acuse registrado', 'success');
            } catch (error) {
                console.error('Error registrando acuse:', error);
                showMessage('Error al registrar: ' + error.message, 'danger');
            }
        }

        async function guardarMiValoracion(goalId) {
            const estado = document.getElementById('est-prof-' + goalId).value;
            const comentario = document.getElementById('com-prof-' + goalId).value.trim();
            if (!estado) { showMessage('Seleccione cómo le fue con la meta', 'warning'); return; }

            try {
                await supabaseRequest(`/teval_dn_plan_goals?goal_id=eq.${goalId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        teacher_status: estado,
                        teacher_comment: comentario || null,
                        teacher_status_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });
                misMetas = await supabaseRequest(`/teval_dn_plan_goals?select=*&plan_id=eq.${miPlan.plan_id}&order=goal_order.asc`);
                renderPlan();
                showMessage('Valoración guardada', 'success');
            } catch (error) {
                console.error('Error guardando valoración:', error);
                showMessage('Error al guardar: ' + error.message, 'danger');
            }
        }

        function formatearFecha(iso) {
            if (!iso) return '';
            const partes = iso.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // ==========================================
        // UTILIDADES
        // ==========================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.toggleDomain = toggleDomain;
        window.responderCriterio = responderCriterio;
        window.enviarResponsabilidades = enviarResponsabilidades;
        window.darAcuse = darAcuse;
        window.guardarMiValoracion = guardarMiValoracion;
        window.alternarMarca = alternarMarca;
        window.enviarAutoevaluacion = enviarAutoevaluacion;

        console.log('🎉 Autoevaluación Danielson cargada');
    </script>
</body>
