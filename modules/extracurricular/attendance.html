<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="page-version" content="26.7.31.1">
    <title>Asistencia a Extracurriculares - SchoolNet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-overlay.hidden { display: none; }
        .loading-content { background: white; padding: 2rem; border-radius: 8px; text-align: center; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #993556; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-ec { background-color: #993556; border-color: #993556; color: #fff; }
        .btn-ec:hover { background-color: #7d2b46; border-color: #7d2b46; color: #fff; }

        .badge-estado { font-size: 0.75rem; font-weight: 500; padding: 0.35em 0.65em; }
        .estado-draft { background-color: #e9ecef; color: #495057; }
        .estado-published { background-color: #dbeafe; color: #1e40af; }
        .estado-enrollment_closed { background-color: #fef3c7; color: #92400e; }
        .estado-delivered { background-color: #e0e7ff; color: #3730a3; }
        .estado-closed { background-color: #d1d5db; color: #1f2937; }

        .table th { font-size: 0.85rem; white-space: nowrap; }
        .table td { vertical-align: middle; font-size: 0.9rem; }
        .empty-state { text-align: center; padding: 2.5rem 1rem; color: #6c757d; }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
        .count-badge { background-color: #993556; color: white; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 1rem; }
        .hint { font-size: 0.8rem; color: #6c757d; }

        .chip { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 0.3rem; background-color: #f1f3f5; color: #495057; white-space: nowrap; display: inline-block; margin: 0.1rem 0.15rem 0.1rem 0; }
        .chip-dia { background-color: #f8e8ee; color: #7d2b46; }
        .chip-ok { background-color: #d1f0e0; color: #14683f; }
        .chip-falta { background-color: #fde2e1; color: #8c2f2d; font-weight: 500; }

        .fila-retirada td { opacity: 0.55; }
        .sin-marcar td:first-child { border-left: 3px solid #f0ad4e; }
        .col-marcas { width: 220px; }
    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="mb-0">Cargando asistencia...</p>
        </div>
    </div>

    <div class="container-fluid">

        <nav aria-label="breadcrumb" class="mt-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="../../dashboard.html"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="breadcrumb-item"><a href="../../dashboard.html">Extracurriculares</a></li>
                <li class="breadcrumb-item active" aria-current="page">Asistencia</li>
            </ol>
        </nav>

        <div class="row mb-4">
            <div class="col">
                <h1 class="h3">
                    <i class="bi bi-check2-square me-2" style="color: #993556;"></i>
                    Asistencia a Extracurriculares
                </h1>
                <p class="text-muted">
                    Se registra por fecha, no por actividad: un mismo día pueden correr varias actividades a la vez.
                    Nada queda guardado hasta que se pulse Guardar.
                </p>
            </div>
        </div>

        <div id="alertContainer"></div>

        <!-- ============================================================ -->
        <!-- TEMPORADA Y FECHA -->
        <!-- ============================================================ -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-5 mb-2 mb-md-0">
                        <label class="form-label mb-1">Temporada</label>
                        <select class="form-select" id="selector-temporada" onchange="seleccionarTemporada()">
                            <option value="">Seleccionar temporada...</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <label class="form-label mb-1">Fecha</label>
                        <input type="date" class="form-control" id="selector-fecha" onchange="seleccionarFecha()" disabled>
                    </div>
                    <div class="col-md-4">
                        <div id="info-temporada" class="hint"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="avisos-fecha" class="mb-3"></div>

        <!-- ============================================================ -->
        <!-- ACTIVIDADES DEL DÍA -->
        <!-- ============================================================ -->
        <div id="panel-dia"></div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="calendario-escolar.js"></script>
    <script src="extracurricular-engine.js"></script>

    <script>
        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        let currentUser = null;
        let cacheTemporadas = [];
        let temporadaSel = null;
        let diasTemporada = [];        // day_of_week habilitados de la temporada
        let insumosCalendario = null;  // { excluidas: { 'YYYY-MM-DD': {tipo, descripcion} }, ... }
        let fechaSel = null;           // 'YYYY-MM-DD'
        let actividadesDia = [];       // actividades que corren ese día de la semana
        let filasPorActividad = {};    // activity_id -> [ fila ]
        let marcas = {};               // enrollment_id -> 'present' | 'absent'

        const ESTADOS = {
            draft:             { texto: 'Borrador',                clase: 'estado-draft' },
            published:         { texto: 'Publicada',               clase: 'estado-published' },
            enrollment_closed: { texto: 'Inscripciones cerradas',  clase: 'estado-enrollment_closed' },
            delivered:         { texto: 'Entregada a Tesorería',   clase: 'estado-delivered' },
            closed:            { texto: 'Cerrada',                 clase: 'estado-closed' }
        };

        // Solo dos estados en la interfaz. 'excused' existe en la restricción de
        // base pero no se ofrece: nada del módulo se comporta distinto según si
        // la ausencia fue justificada, así que sería un dato que nadie usa.
        const ASISTENCIA = {
            present: { texto: 'Presente', clase: 'btn-success' },
            absent:  { texto: 'Ausente',  clase: 'btn-danger'  }
        };

        // Estados de actividad que no corren y por lo tanto no tienen asistencia
        const ACTIVIDADES_SIN_CLASE = ['draft', 'not_opened', 'cancelled'];

        const fmtFecha = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

        const badgeEstado = e => {
            const cfg = ESTADOS[e] || { texto: e, clase: 'estado-draft' };
            return `<span class="badge badge-estado ${cfg.clase}">${cfg.texto}</span>`;
        };

        const nombreEstudiante = s => s
            ? `${s.student_first_name || ''} ${s.student_last_name_1 || ''} ${s.student_last_name_2 || ''}`.replace(/\s+/g, ' ').trim()
            : '—';

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const hasAccess = await validatePageAccess('Registrar asistencia a extracurriculares');
                if (!hasAccess) return;

                const session = getStoredSession();
                if (!session || !session.user) {
                    showMessage('Sesión no válida. Redirigiendo...', 'warning');
                    setTimeout(() => window.location.href = '../../login.html', 1500);
                    return;
                }
                currentUser = session.user;

                mostrarLoading();
                await cargarTemporadas();
                ocultarLoading();

            } catch (error) {
                console.error('❌ Error inicializando:', error);
                showMessage('Error al cargar la página: ' + error.message, 'danger');
                ocultarLoading();
            }
        });

        // ==========================================
        // TEMPORADAS
        // ==========================================
        async function cargarTemporadas() {
            const data = await supabaseRequest(
                '/svc_extracurricular_cycles?select=*,academic_years(year_name)&order=start_date.desc'
            );

            // La asistencia se registra desde que la temporada está publicada. El
            // flujo la ubica en 'delivered', pero la entrega a Tesorería ocurre
            // semanas después del inicio de clases: exigirla dejaría las primeras
            // sesiones sin poder registrarse.
            cacheTemporadas = (data || []).filter(t => t.season_status !== 'draft');

            const sel = document.getElementById('selector-temporada');
            sel.innerHTML = '<option value="">Seleccionar temporada...</option>' +
                cacheTemporadas.map(t =>
                    `<option value="${t.cycle_id}">${escaparHTML(t.cycle_name)}</option>`
                ).join('');

            if (cacheTemporadas.length === 0) {
                showMessage('No hay temporadas publicadas. Publique una en Temporadas antes de registrar asistencia.', 'info');
            }
        }

        async function seleccionarTemporada() {
            const id = document.getElementById('selector-temporada').value;
            limpiarDia();
            temporadaSel = cacheTemporadas.find(t => t.cycle_id === id) || null;

            const inputFecha = document.getElementById('selector-fecha');
            const info = document.getElementById('info-temporada');

            if (!temporadaSel) {
                inputFecha.value = '';
                inputFecha.disabled = true;
                info.innerHTML = '';
                return;
            }

            try {
                mostrarLoading();

                diasTemporada = (await supabaseRequest(
                    `/svc_extracurricular_cycle_days?select=day_of_week&cycle_id=eq.${temporadaSel.cycle_id}&order=day_of_week.asc`
                ) || []).map(d => d.day_of_week);

                insumosCalendario = await ecObtenerInsumosCalendario(temporadaSel.academic_year_id);

                inputFecha.min = temporadaSel.start_date;
                inputFecha.max = temporadaSel.end_date;
                inputFecha.disabled = false;

                info.innerHTML = `${badgeEstado(temporadaSel.season_status)}
                    <span class="ms-2">Del ${fmtFecha(temporadaSel.start_date)} al ${fmtFecha(temporadaSel.end_date)}</span>
                    <div class="mt-1">Días: ${diasTemporada.map(d => `<span class="chip chip-dia">${EC_DIAS_NOMBRE[d]}</span>`).join('') || '—'}</div>`;

                // Si hoy cae dentro de la temporada, se propone; si no, no se
                // adivina: proponer una fecha arbitraria invita a registrar el día
                // equivocado sin darse cuenta.
                const hoy = ecISO(new Date());
                if (hoy >= temporadaSel.start_date && hoy <= temporadaSel.end_date) {
                    inputFecha.value = hoy;
                    ocultarLoading();
                    await seleccionarFecha();
                    return;
                }
                inputFecha.value = '';
                ocultarLoading();

            } catch (err) {
                ocultarLoading();
                console.error('❌ Error cargando la temporada:', err);
                showMessage('Error al cargar la temporada: ' + (err.message || ''), 'danger');
            }
        }

        function limpiarDia() {
            fechaSel = null;
            actividadesDia = [];
            filasPorActividad = {};
            marcas = {};
            document.getElementById('avisos-fecha').innerHTML = '';
            document.getElementById('panel-dia').innerHTML = '';
        }

        // ==========================================
        // FECHA
        // ==========================================
        async function seleccionarFecha() {
            const valor = document.getElementById('selector-fecha').value;
            limpiarDia();
            if (!temporadaSel || !valor) return;

            const avisos = document.getElementById('avisos-fecha');

            if (valor < temporadaSel.start_date || valor > temporadaSel.end_date) {
                avisos.innerHTML = alerta('danger', 'calendar-x',
                    `El ${fmtFecha(valor)} está fuera del rango de la temporada, que va del
                     ${fmtFecha(temporadaSel.start_date)} al ${fmtFecha(temporadaSel.end_date)}.`);
                return;
            }

            const dow = ecDiaSemana(ecFecha(valor));
            if (!diasTemporada.includes(dow)) {
                avisos.innerHTML = alerta('danger', 'calendar-x',
                    `El ${fmtFecha(valor)} es ${EC_DIAS_NOMBRE[dow].toLowerCase()}, y la temporada no tiene
                     actividades ese día. Días habilitados: ${diasTemporada.map(d => EC_DIAS_NOMBRE[d]).join(', ')}.`);
                return;
            }

            // Advertencia, no bloqueo: el coordinador puede saber de una sesión de
            // recuperación que el calendario institucional no registra.
            const recesos = calMapaFechasReceso(
                parseInt(temporadaSel.start_date.slice(0, 4), 10),
                parseInt(temporadaSel.end_date.slice(0, 4), 10)
            );
            const exc = (insumosCalendario && insumosCalendario.excluidas[valor])
                || (recesos[valor] ? { tipo: 'break', descripcion: recesos[valor] } : null);

            if (exc) {
                avisos.innerHTML = alerta('warning', 'exclamation-triangle',
                    `El ${fmtFecha(valor)} no es día lectivo: <strong>${escaparHTML(exc.descripcion)}</strong>.
                     No se descontó del conteo de sesiones por casualidad, así que normalmente no hubo actividad.
                     Puede registrar igual si la sesión sí ocurrió.`);
            }

            fechaSel = valor;

            try {
                mostrarLoading();
                await cargarDia(dow);
                ocultarLoading();
                renderDia();
            } catch (err) {
                ocultarLoading();
                console.error('❌ Error cargando el día:', err);
                showMessage('Error al cargar el día: ' + (err.message || ''), 'danger');
            }
        }

        async function cargarDia(dow) {
            const cid = temporadaSel.cycle_id;

            // 1. Actividades que corren ese día de la semana
            const dias = await supabaseRequest(
                `/svc_extracurricular_activity_days?select=activity_id&cycle_id=eq.${cid}&day_of_week=eq.${dow}`
            ) || [];

            if (dias.length === 0) { actividadesDia = []; return; }

            const ids = dias.map(d => d.activity_id);
            const acts = await supabaseRequest(
                `/svc_extracurricular_activities?select=activity_id,activity_name,activity_status,display_order` +
                `&activity_id=in.(${ids.join(',')})&order=display_order.asc.nullslast,activity_name.asc`
            ) || [];

            actividadesDia = acts.filter(a => !ACTIVIDADES_SIN_CLASE.includes(a.activity_status));
            if (actividadesDia.length === 0) return;

            const idsVivas = actividadesDia.map(a => a.activity_id);

            // 2. Inscripciones activas de esas actividades
            const inscripciones = await supabaseRequest(
                `/svc_extracurricular_enrollments?select=enrollment_id,activity_id,student_id,enrollment_status,` +
                `students(student_id,student_code,student_first_name,student_last_name_1,student_last_name_2,courses(course_name))` +
                `&cycle_id=eq.${cid}&activity_id=in.(${idsVivas.join(',')})&enrollment_status=eq.active`
            ) || [];

            // 3. Asistencia ya registrada en esa fecha.
            //    Se consulta por la inscripción, sin filtrar por su estado: quien se
            //    retiró en octubre sí estuvo en septiembre, y su registro debe seguir
            //    viéndose. Los días ocupados se borran al retirar; la asistencia no.
            const asistencia = await supabaseRequest(
                `/svc_extracurricular_attendance?select=attendance_id,enrollment_id,attendance_status,` +
                `svc_extracurricular_enrollments!inner(enrollment_id,activity_id,student_id,enrollment_status,` +
                `students(student_id,student_code,student_first_name,student_last_name_1,student_last_name_2,courses(course_name)))` +
                `&attendance_date=eq.${fechaSel}&svc_extracurricular_enrollments.cycle_id=eq.${cid}`
            ) || [];

            // 4. Se arma una fila por inscripción, uniendo ambas fuentes
            const porInscripcion = {};

            inscripciones.forEach(i => {
                porInscripcion[i.enrollment_id] = {
                    enrollment_id: i.enrollment_id,
                    activity_id: i.activity_id,
                    estudiante: i.students,
                    retirada: false,
                    attendance_id: null,
                    original: null
                };
            });

            asistencia.forEach(a => {
                const e = a.svc_extracurricular_enrollments;
                if (!e) return;
                if (!idsVivas.includes(e.activity_id)) return;

                if (!porInscripcion[a.enrollment_id]) {
                    porInscripcion[a.enrollment_id] = {
                        enrollment_id: a.enrollment_id,
                        activity_id: e.activity_id,
                        estudiante: e.students,
                        retirada: true,
                        attendance_id: null,
                        original: null
                    };
                }
                porInscripcion[a.enrollment_id].attendance_id = a.attendance_id;
                porInscripcion[a.enrollment_id].original = a.attendance_status;
                marcas[a.enrollment_id] = a.attendance_status;
            });

            filasPorActividad = {};
            actividadesDia.forEach(a => { filasPorActividad[a.activity_id] = []; });

            Object.values(porInscripcion).forEach(f => {
                if (filasPorActividad[f.activity_id]) filasPorActividad[f.activity_id].push(f);
            });

            Object.keys(filasPorActividad).forEach(k => {
                filasPorActividad[k].sort((x, y) =>
                    nombreApellido(x.estudiante).localeCompare(nombreApellido(y.estudiante), 'es'));
            });
        }

        const nombreApellido = s => s
            ? `${s.student_last_name_1 || ''} ${s.student_last_name_2 || ''} ${s.student_first_name || ''}`.trim()
            : '';

        // ==========================================
        // RENDER
        // ==========================================
        function renderDia() {
            const cont = document.getElementById('panel-dia');

            if (!fechaSel) { cont.innerHTML = ''; return; }

            if (actividadesDia.length === 0) {
                cont.innerHTML = `<div class="card"><div class="card-body">
                    <div class="empty-state"><i class="bi bi-calendar-week"></i>
                    Ninguna actividad de la temporada corre ese día, o las que corren no se abrieron.</div>
                </div></div>`;
                return;
            }

            cont.innerHTML = actividadesDia.map(a => renderActividad(a)).join('');
        }

        function renderActividad(a) {
            const filas = filasPorActividad[a.activity_id] || [];
            const marcadas = filas.filter(f => marcas[f.enrollment_id]).length;

            if (filas.length === 0) {
                return `<div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-people me-2"></i>${escaparHTML(a.activity_name)}</h5>
                    </div>
                    <div class="card-body">
                        <div class="empty-state"><i class="bi bi-person-x"></i>Sin inscritos activos</div>
                    </div>
                </div>`;
            }

            const cuerpo = filas.map(f => {
                const marca = marcas[f.enrollment_id] || null;
                const clases = [];
                if (f.retirada) clases.push('fila-retirada');
                if (!marca) clases.push('sin-marcar');

                const botones = f.retirada
                    ? `<span class="chip">${ASISTENCIA[marca] ? ASISTENCIA[marca].texto : '—'}</span>`
                    : Object.keys(ASISTENCIA).map(k => `
                        <button type="button"
                            class="btn btn-sm ${marca === k ? ASISTENCIA[k].clase : 'btn-outline-secondary'}"
                            onclick="marcar('${f.enrollment_id}', '${k}')">${ASISTENCIA[k].texto}</button>`).join(' ');

                return `<tr class="${clases.join(' ')}">
                    <td>
                        <div class="fw-semibold">${escaparHTML(nombreEstudiante(f.estudiante))}</div>
                        <div class="hint">${f.estudiante?.student_code ?? ''}</div>
                    </td>
                    <td>${escaparHTML(f.estudiante?.courses?.course_name || '—')}</td>
                    <td class="col-marcas">${botones}</td>
                    <td>${f.retirada
                            ? '<span class="chip chip-falta">Inscripción retirada</span>'
                            : (f.original ? '<span class="chip chip-ok">Guardado</span>' : '')}</td>
                </tr>`;
            }).join('');

            return `<div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h5 class="mb-0">
                        <i class="bi bi-people me-2"></i>${escaparHTML(a.activity_name)}
                        <span class="count-badge ms-2">${marcadas} de ${filas.length}</span>
                    </h5>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary me-2" onclick="todosPresentes('${a.activity_id}')">
                            <i class="bi bi-check-all me-1"></i>Todos presentes
                        </button>
                        <button class="btn btn-sm btn-ec" onclick="guardarActividad('${a.activity_id}')">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Estudiante</th>
                                    <th>Curso</th>
                                    <th class="col-marcas">Asistencia</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>${cuerpo}</tbody>
                        </table>
                    </div>
                    <div class="hint mt-2">
                        Las filas sin marcar quedan sin registro: no se guarda nada por omisión.
                    </div>
                </div>
            </div>`;
        }

        function marcar(enrollmentId, estado) {
            marcas[enrollmentId] = estado;
            renderDia();
        }

        function todosPresentes(activityId) {
            (filasPorActividad[activityId] || []).forEach(f => {
                if (!f.retirada) marcas[f.enrollment_id] = 'present';
            });
            renderDia();
        }

        // ==========================================
        // GUARDADO
        // Sin upsert: la página ya sabe qué filas existen para esa fecha, así que
        // actualiza las que hay y crea las que faltan. Un upsert exigiría el header
        // Prefer: resolution=merge-duplicates, y el contrato de supabaseRequest()
        // no admite headers explícitos.
        // ==========================================
        async function guardarActividad(activityId) {
            const filas = (filasPorActividad[activityId] || []).filter(f => !f.retirada);
            const ahora = new Date().toISOString();

            const nuevas = [];
            const cambiadas = [];

            filas.forEach(f => {
                const estado = marcas[f.enrollment_id];
                if (!estado) return;                       // sin marcar: no se toca
                if (!f.attendance_id) {
                    nuevas.push({
                        enrollment_id: f.enrollment_id,
                        attendance_date: fechaSel,
                        attendance_status: estado,
                        recorded_by: currentUser?.user_id || null
                    });
                } else if (estado !== f.original) {
                    cambiadas.push({ fila: f, estado });
                }
            });

            if (nuevas.length === 0 && cambiadas.length === 0) {
                showMessage('No hay cambios por guardar en esta actividad.', 'info');
                return;
            }

            try {
                mostrarLoading();

                if (nuevas.length > 0) {
                    await supabaseRequest('/svc_extracurricular_attendance', {
                        method: 'POST', body: JSON.stringify(nuevas)
                    });
                }

                for (const c of cambiadas) {
                    await supabaseRequest(
                        `/svc_extracurricular_attendance?attendance_id=eq.${c.fila.attendance_id}`,
                        { method: 'PATCH', body: JSON.stringify({
                            attendance_status: c.estado,
                            recorded_by: currentUser?.user_id || null,
                            updated_at: ahora
                        }) }
                    );
                }

                const dow = ecDiaSemana(ecFecha(fechaSel));
                await cargarDia(dow);
                ocultarLoading();
                renderDia();

                showMessage(
                    `Asistencia guardada: ${nuevas.length} nueva(s), ${cambiadas.length} corregida(s).`,
                    'success');

            } catch (err) {
                ocultarLoading();
                console.error('❌ Error guardando asistencia:', err);
                traducirError(err);
            }
        }

        function traducirError(err) {
            const bruto = err.message || '';
            let m = bruto;
            const llave = bruto.indexOf('{');
            if (llave !== -1) {
                try {
                    const j = JSON.parse(bruto.slice(llave));
                    if (j && j.message) m = j.message;
                } catch (e) { /* se queda el texto crudo */ }
            }

            if (m.includes('attendance_unique')) {
                showMessage('Alguien registró esa asistencia mientras usted trabajaba. Recargue la fecha.', 'warning');
            } else if (m.includes('attendance_status_check')) {
                showMessage('Estado de asistencia no admitido por la base de datos.', 'warning');
            } else {
                showMessage('Error al guardar: ' + m, 'danger');
            }
        }

        // ==========================================
        // UTILIDADES
        // ==========================================
        function alerta(tipo, icono, html) {
            return `<div class="alert alert-${tipo} py-2 px-3 mb-0" style="font-size:0.85rem;">
                        <i class="bi bi-${icono} me-1"></i>${html}
                    </div>`;
        }

        function escaparHTML(s) {
            return String(s ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function mostrarLoading() { document.getElementById('loading-overlay')?.classList.remove('hidden'); }
        function ocultarLoading() { document.getElementById('loading-overlay')?.classList.add('hidden'); }
    </script>
</body>
</html>
